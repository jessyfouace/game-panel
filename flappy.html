<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Flappy Space - Arcade 🚀</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            touch-action: none;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 4em;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border-radius: 2.5rem;
            width: 100%;
            max-width: 400px;
            height: 65vh;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="py-8 px-4">

    <div class="w-full max-w-md flex items-center justify-between mb-6">
        <a href="index.html" class="w-12 h-12 glass rounded-2xl flex items-center justify-center text-slate-400 active:scale-90 transition-transform">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="glass px-6 py-2 rounded-2xl flex items-center gap-3">
            <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Score</span>
            <span id="score-val" class="font-bold text-xl text-blue-400">0</span>
        </div>
        <div class="w-12"></div>
    </div>

    <div class="relative w-full max-w-[400px]">
        <canvas id="gameCanvas"></canvas>
        
        <div id="overlay" class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm rounded-[2.5rem] flex flex-col items-center justify-center text-center p-6 z-50">
            <div id="ui-content">
                <div id="icon-box" class="w-20 h-20 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center text-3xl mb-4 mx-auto animate-bounce">
                    <i class="fa-solid fa-rocket"></i>
                </div>
                <h2 id="title" class="text-2xl font-bold mb-2 text-white">Flappy Space</h2>
                <p id="msg" class="text-slate-400 mb-8 text-sm">Touche pour faire décoller la fusée</p>
                <button id="main-btn" class="bg-blue-500 text-white px-10 py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/20 active:scale-95 transition-all">
                    DÉMARRER
                </button>
            </div>
        </div>
    </div>

    <div class="mt-8 text-slate-500 text-[10px] uppercase font-bold tracking-[0.3em] animate-pulse">
        Tapote pour monter
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-val');
        const overlay = document.getElementById('overlay');
        const mainBtn = document.getElementById('main-btn');
        const titleText = document.getElementById('title');
        const msgText = document.getElementById('msg');
        const iconBox = document.getElementById('icon-box');

        canvas.width = 400;
        canvas.height = 600;

        let rocket, pipes, score, gameActive, frame;
        const gravity = 0.22;
        const jump = -4.8;
        const pipeWidth = 65;
        const pipeGap = 170;

        function init() {
            rocket = { x: 60, y: 300, w: 34, h: 24, velocity: 0 };
            pipes = [];
            score = 0;
            gameActive = false;
            scoreDisplay.innerText = "0";
            draw();
        }

        function startGame() {
            init();
            gameActive = true;
            overlay.classList.add('hidden');
            animate();
        }

        function animate() {
            if (!gameActive) return;
            update();
            draw();
            frame = requestAnimationFrame(animate);
        }

        function update() {
            rocket.velocity += gravity;
            rocket.y += rocket.velocity;

            if (rocket.y + rocket.h > canvas.height || rocket.y < 0) {
                gameOver();
            }

            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 220) {
                let pipeY = Math.random() * (canvas.height - pipeGap - 120) + 60;
                pipes.push({ x: canvas.width, y: pipeY, passed: false });
            }

            pipes.forEach((pipe) => {
                pipe.x -= 2.8;
                if (rocket.x < pipe.x + pipeWidth &&
                    rocket.x + rocket.w > pipe.x &&
                    (rocket.y < pipe.y || rocket.y + rocket.h > pipe.y + pipeGap)) {
                    gameOver();
                }
                if (!pipe.passed && rocket.x > pipe.x + pipeWidth) {
                    pipe.passed = true;
                    score++;
                    scoreDisplay.innerText = score;
                    if (navigator.vibrate) navigator.vibrate(10);
                }
            });

            if (pipes.length > 0 && pipes[0].x < -pipeWidth) pipes.shift();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Obstacles néons
            pipes.forEach(pipe => {
                ctx.fillStyle = "rgba(59, 130, 246, 0.2)";
                ctx.strokeStyle = "rgba(59, 130, 246, 0.6)";
                ctx.lineWidth = 3;
                
                // Haut
                ctx.beginPath();
                ctx.roundRect(pipe.x, 0, pipeWidth, pipe.y, [0, 0, 15, 15]);
                ctx.fill(); ctx.stroke();

                // Bas
                ctx.beginPath();
                ctx.roundRect(pipe.x, pipe.y + pipeGap, pipeWidth, canvas.height - (pipe.y + pipeGap), [15, 15, 0, 0]);
                ctx.fill(); ctx.stroke();
            });

            // Fusée avec rotation
            ctx.font = "32px serif";
            ctx.save();
            ctx.translate(rocket.x + rocket.w/2, rocket.y + rocket.h/2);
            let angle = Math.min(Math.PI/4, Math.max(-Math.PI/4, rocket.velocity * 0.12));
            ctx.rotate(angle);
            ctx.fillText("🚀", -16, 12);
            ctx.restore();
        }

        function gameOver() {
            gameActive = false;
            cancelAnimationFrame(frame);
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            
            titleText.innerText = "CRASH !";
            msgText.innerText = `Score final : ${score}`;
            iconBox.innerHTML = '<i class="fa-solid fa-explosion"></i>';
            iconBox.classList.replace('text-blue-400', 'text-red-400');
            mainBtn.innerText = "RÉESSAYER";
            overlay.classList.remove('hidden');
        }

        function handleInput(e) {
            if (gameActive) {
                rocket.velocity = jump;
                if (e) e.preventDefault();
            }
        }

        // Ecouteurs d'événements
        mainBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        window.addEventListener('touchstart', (e) => {
            if (gameActive) handleInput(e);
        }, { passive: false });

        window.addEventListener('mousedown', () => {
            if (gameActive) handleInput();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (!gameActive && !overlay.classList.contains('hidden')) startGame();
                else handleInput();
            }
        });

        init();
    </script>
</body>
</html>
