<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Quiz Plaques d'Immatriculation 🚗</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            touch-action: manipulation;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Evite que le contenu passe sous la caméra du téléphone */
            padding-top: calc(2rem + env(safe-area-inset-top));
        }
        .safe-padding-top {
            padding-top: calc(1rem + env(safe-area-inset-top));
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .choice-btn {
            transition: all 0.2s ease;
        }
        .choice-btn:active {
            transform: scale(0.95);
        }
        .correct {
            background: rgba(34, 197, 94, 0.2) !important;
            border-color: rgba(34, 197, 94, 0.5) !important;
            color: #4ade80 !important;
        }
        .wrong {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: rgba(239, 68, 68, 0.5) !important;
            color: #f87171 !important;
        }

        .license-plate {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255,255,255,0.2);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        .license-plate::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(0,0,0,0.08) 1px, transparent 1px);
            background-size: 3px 3px;
            opacity: 0.6;
            pointer-events: none;
            z-index: 2;
        }
        .euro-stars {
            background-image: radial-gradient(circle, #facc15 0.8px, transparent 0.8px);
            background-size: 5px 5px;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body class="pb-10 px-4">

                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>

                    <div class="text-xs text-slate-400 mt-1">Saisie manuelle. Indice (+0.5 pt) ou Validation par Entrée.</div>
                </button>
            </div>
        </div>
        <div class="h-12 w-full"></div>
    </div>

        let gameMode = 'easy';
        let currentCountry = null;
        let currentPlateHTML = ''; // Stocke le code HTML généré pour la plaque courante
        let score = 0;
        let questionCount = 0;
        const maxQuestions = 20;
        let isWaiting = false;
        let hintUsed = false;
        let gamePool = [];
        let gameHistory = [];

        function formatScore(num) {
            return Number(num.toFixed(1)).toString();
        }

        function setDifficulty(mode) {
            gameMode = mode;
            document.getElementById('difficulty-screen').classList.add('hidden');
            
            if (gameMode === 'easy') {
                document.getElementById('choices-container').classList.remove('hidden');
            } else {
                document.getElementById('input-container').classList.remove('hidden');
                setupInputListener();
            }

            gamePool = [...originalCountries].sort(() => Math.random() - 0.5);
            score = 0;
            questionCount = 0;
            gameHistory = [];

            loadNextPlate();
        }

        function setupInputListener() {
            const input = document.getElementById('code-input');
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    submitManualAnswer();
                }
            });
        }

        function randLetter() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            return chars[Math.floor(Math.random() * chars.length)];
        }

        function randNum() {
            return Math.floor(Math.random() * 10);
        }

        function generateRandomText(format) {
            return format.replace(/[A-Z]/g, randLetter).replace(/[0-9]/g, randNum);
        }

        function buildPlateHTML(country) {
            const textStr = generateRandomText(country.format);
            const borderStyle = country.redBorder ? 'border-[3px] border-red-600' : 'border-[3px] border-slate-800';
            
            if (country.tunStyle) {
                return `<div class="license-plate bg-slate-955 text-white h-14 w-full rounded border-[3px] border-slate-800 flex items-center justify-between px-4 text-xl font-bold shadow-md"><span class="font-mono tracking-widest">${textStr.split(' ')[0]}</span><div class="text-xs bg-red-600 text-white font-bold px-2 py-0.5 rounded text-center">تونس</div><span class="font-mono tracking-widest">${textStr.split(' ')[1]}</span></div>`;
            }
            if (country.marStyle) {
                return `<div class="license-plate bg-white text-slate-900 h-14 w-full rounded border-[3px] border-slate-800 flex items-center justify-between font-mono text-xl shadow-md overflow-hidden"><div class="flex-1 text-center font-bold tracking-widest">${textStr.split(' ')[0]}</div><div class="h-full w-10 border-l-2 border-r-2 border-slate-800 flex items-center justify-center font-black text-lg bg-slate-50">${textStr.split(' ')[1]}</div><div class="w-12 text-center font-bold text-base text-slate-500">${textStr.split(' ')[2]}</div></div>`;
            }
            if (country.araStyle) {
                return `<div class="license-plate bg-white text-slate-900 h-14 w-full rounded border-[3px] border-slate-800 flex items-center justify-between font-mono text-base shadow-md px-2"><div class="flex flex-col text-left leading-none"><span class="text-[8px] text-slate-400">ALG</span><span class="font-bold tracking-tight">${textStr}</span></div><div class="text-xs border-l pl-2 border-slate-300 font-sans text-slate-600 font-bold">${country.regionText}</div></div>`;
            }
            if (country.pkStyle) {
                return `<div class="license-plate bg-teal-900 text-white h-14 w-full rounded border-[3px] border-amber-500 flex flex-col items-center justify-center shadow-md relative py-1"><span class="text-[7px] text-teal-400 tracking-widest uppercase font-bold">ISLAMABAD</span><span class="font-mono text-lg font-black tracking-wide">${textStr}</span></div>`;
            }
            if (country.nplStyle) {
                return `<div class="license-plate bg-red-700 text-white h-14 w-full rounded border-[3px] border-red-900 flex flex-col items-center justify-center shadow-md py-1"><span class="text-[6px] tracking-tighter opacity-80">NEPAL - BAGMATI</span><span class="font-sans text-base font-black tracking-wider">${textStr}</span></div>`;
            }
            if (country.bdStyle) {
                return `<div class="license-plate bg-green-800 text-white h-14 w-full rounded border-[3px] border-slate-800 flex flex-col items-center justify-center shadow-md py-1"><span class="text-[8px] font-sans text-green-300">DHAKA</span><span class="font-mono text-lg font-black tracking-widest">${textStr}</span></div>`;
            }
            if (country.vnStyle) {
                return `<div class="license-plate bg-white text-slate-955 h-14 w-full rounded border-[2px] border-slate-400 flex items-center justify-center shadow-md font-mono text-lg font-black tracking-wider"><div class="w-2 h-full bg-red-600 mr-2 flex-shrink-0"></div>${textStr}</div>`;
            }
            if (country.swissShield) {
                return `<div class="license-plate ${country.bg} ${country.text} h-14 w-full rounded border-[3px] border-slate-800 flex items-center justify-between px-3 text-xl font-bold shadow-md"><div class="w-4 h-4 bg-red-600 flex items-center justify-center relative rounded-[2px] flex-shrink-0"><div class="absolute w-2.5 h-0.5 bg-white"></div><div class="absolute w-0.5 h-2.5 bg-white"></div></div><div class="flex-1 text-center font-sans font-black tracking-wide">${textStr}</div><div class="w-4 h-4 bg-gradient-to-b from-blue-600 to-white border border-slate-400 rounded-b-full flex-shrink-0"></div></div>`;
            }
            if (country.monacoShield || country.andorraShield) {
                const badgeHTML = country.monacoShield ? `<div class="w-4 h-5 bg-gradient-to-br from-red-600 via-white to-red-600 border border-slate-300 rounded-[2px] flex-shrink-0"></div>` : `<div class="w-4 h-5 bg-gradient-to-r from-blue-600 via-yellow-400 to-red-600 border border-slate-300 rounded-[2px] flex-shrink-0"></div>`;
                const stateName = country.monacoShield ? 'PRINCIPAUTE DE MONACO' : 'ANDORRA';
                return `<div class="license-plate ${country.bg} ${country.text} h-14 w-3/4 mx-auto rounded border-[3px] border-blue-900 flex flex-col justify-between py-1 px-3 shadow-md relative"><div class="flex items-center justify-start gap-4 w-full h-7">${badgeHTML}<div class="font-sans font-black text-xl tracking-widest flex-1 text-center">${textStr}</div></div><div class="text-[7px] text-center font-sans tracking-tighter opacity-75 font-bold">${stateName}</div></div>`;
            }
            if (country.ruBand) {
                return `<div class="license-plate ${country.bg} ${country.text} h-14 w-full rounded border-[3px] border-slate-800 flex items-center justify-between overflow-hidden shadow-md"><div class="flex-1 text-center font-sans font-bold text-xl tracking-wider pl-4">${textStr}</div><div class="w-14 h-full border-l-2 border-slate-800 flex flex-col items-center justify-center font-sans py-0.5 pr-1 flex-shrink-0"><span class="text-[11px] font-black leading-none">77</span><div class="flex items-center gap-1 mt-0.5"><span class="text-[7px] font-black leading-none text-slate-500">RUS</span><div class="w-4 h-2.5 border border-slate-300 flex flex-col flex-shrink-0"><div class="bg-white h-1/3 w-full"></div><div class="bg-blue-600 h-1/3 w-full"></div><div class="bg-red-600 h-1/3 w-full"></div></div></div></div></div>`;
            }

            let leftBandHTML = '';
            if (country.uaBand) leftBandHTML = `<div class="bg-blue-600 w-7 h-full flex flex-col items-center justify-between pb-1 pt-0.5 text-[8px] text-white font-sans flex-shrink-0 relative"><div class="w-5 h-2.5 bg-gradient-to-b from-blue-500 to-yellow-400 rounded-[1px]"></div><span class="font-black">UA</span></div>`;
            else if (country.noBand) leftBandHTML = `<div class="bg-blue-700 w-7 h-full flex flex-col items-center justify-between pb-1 pt-0.5 text-[8px] text-white font-sans flex-shrink-0 relative"><div class="w-5 h-3 bg-red-600 flex items-center justify-center rounded-[1px] relative"><div class="w-full h-[2px] bg-white absolute"></div><div class="h-full w-[2px] bg-white absolute"></div></div><span class="font-black">N</span></div>`;
            else if (country.alBand) leftBandHTML = `<div class="bg-blue-800 w-7 h-full flex flex-col items-center justify-end pb-1 text-[8px] text-white font-sans flex-shrink-0"><span class="font-black">AL</span></div>`;
            else if (country.byBand) leftBandHTML = `<div class="w-7 h-full flex flex-col items-center justify-between bg-slate-100 border-r border-slate-300 flex-shrink-0 text-[7px] text-slate-900 pb-0.5 font-bold"><div class="w-full h-3 flex flex-col"><div class="bg-red-600 h-2/3 w-full"></div><div class="bg-green-600 h-1/3 w-full"></div></div><span>BY</span></div>`;
            else if (country.srbBand) leftBandHTML = `<div class="bg-blue-700 w-7 h-full flex flex-col items-center justify-end pb-1 text-[8px] text-white font-sans flex-shrink-0"><span class="font-black">SRB</span></div>`;
            else if (country.mdaBand) leftBandHTML = `<div class="bg-blue-700 w-7 h-full flex flex-col items-center justify-end pb-1 text-[8px] text-white font-sans flex-shrink-0"><span class="font-black">MD</span></div>`;
            else if (country.mneBand) leftBandHTML = `<div class="bg-blue-700 w-7 h-full flex flex-col items-center justify-end pb-1 text-[8px] text-white font-sans flex-shrink-0"><span class="font-black">MNE</span></div>`;
            else if (country.xkBand) leftBandHTML = `<div class="bg-blue-700 w-7 h-full flex flex-col items-center justify-end pb-1 text-[8px] text-white font-sans flex-shrink-0"><span class="font-black">RKS</span></div>`;
            else if (country.mkdBand) leftBandHTML = `<div class="bg-blue-700 w-7 h-full flex flex-col items-center justify-end pb-1 text-[8px] text-white font-sans flex-shrink-0"><span class="font-black">NMK</span></div>`;
            else if (country.irBand) leftBandHTML = `<div class="bg-blue-800 w-6 h-full flex flex-col items-center justify-center text-white text-[6px] font-sans flex-shrink-0 gap-1"><div class="w-4 h-2.5 flex flex-col border border-slate-600"><div class="bg-green-600 h-1/3"></div><div class="bg-white h-1/3"></div><div class="bg-red-600 h-1/3"></div></div><span class="font-bold">IRAN</span></div>`;
            else if (country.indBand) leftBandHTML = `<div class="w-6 h-full border-r border-slate-300 flex flex-col items-center justify-center text-blue-800 text-[7px] font-sans flex-shrink-0 bg-slate-50"><span class="font-bold">IND</span></div>`;
            else if (country.ukBand) leftBandHTML = `<div class="bg-blue-800 w-7 h-full flex flex-col items-center justify-end pb-1 text-[8px] text-white font-sans flex-shrink-0 relative"><span class="font-black">UK</span></div>`;
            else if (country.egBand) leftBandHTML = `<div class="bg-blue-400 w-9 h-full flex flex-col items-center justify-center text-slate-900 text-[7px] font-sans font-black flex-shrink-0 border-r border-slate-400"><span>EGYPT</span></div>`;
            else if (country.afgStyle) leftBandHTML = `<div class="w-7 h-full bg-slate-100 flex flex-col items-center justify-center border-r border-slate-300 text-[6px] font-bold text-slate-700 flex-shrink-0"><span>A.F.</span></div>`;
            else if (country.syrStyle) leftBandHTML = `<div class="w-8 h-full bg-slate-100 border-r border-slate-300 flex flex-col items-center justify-center text-[7px] font-bold text-slate-800 flex-shrink-0"><span>SYRIA</span></div>`;
            else if (country.lyStyle) leftBandHTML = `<div class="w-7 h-full bg-slate-100 border-r border-slate-300 flex flex-col items-center justify-center text-[7px] font-bold text-slate-800 flex-shrink-0"><span>LAR</span></div>`;
            else if (country.tcdStyle) leftBandHTML = `<div class="w-8 h-full bg-slate-100 border-r border-slate-300 flex flex-col items-center justify-center text-[7px] font-bold text-slate-800 flex-shrink-0"><span>TCHAD</span></div>`;
            else if (country.somStyle) leftBandHTML = `<div class="w-7 h-full bg-slate-100 border-r border-slate-300 flex flex-col items-center justify-center text-[6px] font-bold text-slate-800 flex-shrink-0"><span>SO</span></div>`;
            else if (country.sdnStyle) leftBandHTML = `<div class="w-7 h-full bg-slate-100 border-r border-slate-300 flex flex-col items-center justify-center text-[6px] font-bold text-slate-800 flex-shrink-0"><span>SUDAN</span></div>`;
            else if (country.eriStyle) leftBandHTML = `<div class="w-7 h-full bg-red-600 border-r border-slate-800 flex flex-col items-center justify-center text-[6px] font-bold text-white flex-shrink-0"><span>ERI</span></div>`;
            else if (country.ethStyle) leftBandHTML = `<div class="w-7 h-full bg-slate-50 border-r border-slate-300 flex flex-col items-center justify-center text-[6px] font-bold text-slate-800 flex-shrink-0"><span>ETH</span></div>`;
            else if (country.gnStyle) leftBandHTML = `<div class="w-7 h-full bg-slate-50 border-r border-slate-300 flex flex-col items-center justify-center text-[6px] font-bold text-slate-800 flex-shrink-0"><span>RG</span></div>`;
            else if (country.lkaStyle) leftBandHTML = `<div class="w-7 h-full bg-slate-50 border-r border-slate-300 flex flex-col items-center justify-center text-[6px] font-bold text-slate-800 flex-shrink-0"><span>SRI</span></div>`;
            else if (country.euro) {
                leftBandHTML = `
                    <div class="bg-blue-600 w-7 h-full flex flex-col items-center justify-between py-1 text-[8px] text-white font-sans flex-shrink-0 select-none">
                        <div class="w-3.5 h-3.5 rounded-full euro-stars opacity-90 mt-0.5"></div>
                        <span class="font-black tracking-tighter mb-0.5">${country.euro}</span>
                    </div>`;
            }

            return `
                <div class="license-plate ${country.bg} ${country.text} ${borderStyle} h-14 w-full rounded flex items-center overflow-hidden text-xl font-black relative shadow-md">
                    ${leftBandHTML}
                    <div class="flex-1 flex flex-col items-center justify-center px-1 font-sans tracking-wide relative h-full">
                        ${country.gaelic ? `<span class="text-[6px] text-slate-500 font-bold tracking-tight absolute top-0.5 uppercase">${country.gaelic}</span>` : ''}
                        <div class="flex items-center justify-center w-full ${country.gaelic ? 'mt-2' : ''}">
                            ${country.seal ? '<div class="w-3.5 h-3.5 rounded-full bg-amber-500/80 border border-slate-400/60 mr-1.5 flex-shrink-0 shadow-sm"></div>' : ''}
                            ${country.croShield ? '<div class="w-3.5 h-4 bg-gradient-to-b from-red-600 via-white to-blue-600 border border-slate-400/50 mr-1.5 flex-shrink-0"></div>' : ''}
                            ${country.skShield ? '<div class="w-3.5 h-4 bg-blue-600 relative border border-slate-300 mr-1.5 flex-shrink-0"><div class="absolute inset-0 flex items-center justify-center text-[5px] text-white">✝</div></div>' : ''}
                            <span class="font-mono text-center">${textStr}</span>
                        </div>
                    </div>
                    ${country.rightBand ? `<div class="${country.rightColor || 'bg-blue-600 text-white'} w-6 h-full flex flex-col items-center justify-center text-[8px] font-sans flex-shrink-0 border-l border-slate-300/10"><span class="font-bold">${country.rightText}</span></div>` : ''}
                </div>
            `;
        }

        function loadNextPlate() {
            if (questionCount >= maxQuestions) {
                endGame();
                return;
            }

            isWaiting = false;
            hintUsed = false;
            questionCount++;
            
            document.getElementById('question-number').innerText = questionCount;

            const choicesContainer = document.getElementById('choices-container');
            const plateBox = document.getElementById('plate-container');
            const feedback = document.getElementById('feedback-message');
            const inputField = document.getElementById('code-input');
            const submitBtn = document.getElementById('submit-btn');
            const hintBtn = document.getElementById('hint-btn');
            
            feedback.classList.add('hidden');
            choicesContainer.innerHTML = '';
            choicesContainer.classList.add('hidden');
            
            if (inputField) {
                inputField.value = '';
                inputField.disabled = false;
                inputField.className = inputField.className.replace(/border-(emerald|rose)-500/, 'border-slate-700');
                inputField.className = inputField.className.replace(/text-(emerald|rose)-400/, 'text-white');
                if(gameMode === 'hard') inputField.focus();
            }
            if(submitBtn) submitBtn.disabled = false;
            if(hintBtn) hintBtn.disabled = false;

            currentCountry = gamePool.shift();
            currentPlateHTML = buildPlateHTML(currentCountry); // Sauvegarde globale pour l'historique
            plateBox.innerHTML = currentPlateHTML;

            let options = [currentCountry];
            while (options.length < 3) {
                let randomWrong = originalCountries[Math.floor(Math.random() * originalCountries.length)];
                if (!options.find(c => c.id === randomWrong.id)) {
                    options.push(randomWrong);
                }
            }
            options.sort(() => Math.random() - 0.5);

            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn glass w-full py-3 rounded-2xl text-lg font-bold text-white border-2 border-transparent flex flex-col items-center justify-center gap-0.5';
                btn.innerHTML = `
                    <span class="tracking-[0.15em] font-black">${option.code}</span>
                    <span class="text-xs font-medium text-slate-400 tracking-wide">${option.name}</span>
                `;
                btn.onclick = () => checkAnswer(option, btn);
                choicesContainer.appendChild(btn);
            });

            if (gameMode === 'easy') {
                choicesContainer.classList.remove('hidden');
            }
        }

        function checkAnswer(selectedOption, btnElement) {
            if (isWaiting) return;
            isWaiting = true;

            const buttons = document.querySelectorAll('.choice-btn');
            let pts = 0;

            if (selectedOption.id === currentCountry.id) {
                if(btnElement) btnElement.classList.add('correct');
                pts = hintUsed ? 0.5 : 1;
            } else {
                if(btnElement) btnElement.classList.add('wrong');
                buttons.forEach(b => {
                    if (b.innerHTML.includes(currentCountry.code)) b.classList.add('correct');
                });
            }

            gameHistory.push({
                country: currentCountry,
                userAnswer: selectedOption.code,
                correct: selectedOption.id === currentCountry.id,
                pts: pts,
                hint: hintUsed,
                plateHTML: currentPlateHTML // On mémorise la plaque exacte
            });

            handleScoreUpdate(pts);
        }

        function submitManualAnswer() {
            if (isWaiting || gameMode !== 'hard') return;
            
            const inputField = document.getElementById('code-input');
            const submitBtn = document.getElementById('submit-btn');
            const enteredCode = inputField.value.trim().toUpperCase();

            if (enteredCode.length === 0) return;

            isWaiting = true;
            inputField.disabled = true;
            if (submitBtn) submitBtn.disabled = true;

            let pts = 0;
            let isCorrect = enteredCode === currentCountry.code;

            if (isCorrect) {
                inputField.className = inputField.className.replace('border-slate-700', 'border-emerald-500 text-emerald-400');
                showFeedback(`Correct ! C'était bien : ${currentCountry.flag} ${currentCountry.name}`, 'text-emerald-400');
                pts = hintUsed ? 0.5 : 1;
            } else {
                inputField.className = inputField.className.replace('border-slate-700', 'border-rose-500 text-rose-400');
                showFeedback(`Faux ! La réponse était ${currentCountry.code} (${currentCountry.name})`, 'text-rose-400');
            }

            gameHistory.push({
                country: currentCountry,
                userAnswer: enteredCode || "Aucune",
                correct: isCorrect,
                pts: pts,
                hint: hintUsed,
                plateHTML: currentPlateHTML // On mémorise la plaque exacte
            });

            handleScoreUpdate(pts);
        }

        function useHint() {
            if (isWaiting) return;
            hintUsed = true;
            document.getElementById('choices-container').classList.remove('hidden');
            document.getElementById('hint-btn').disabled = true;
        }

        function giveUp() {
            if (isWaiting) return;
            isWaiting = true;
            
            const inputField = document.getElementById('code-input');
            const submitBtn = document.getElementById('submit-btn');
            
            if(inputField) {
                inputField.disabled = true;
                inputField.value = currentCountry.code;
                inputField.className = inputField.className.replace('border-slate-700', 'border-rose-500 text-rose-400');
            }
            if(submitBtn) submitBtn.disabled = true;
            
            showFeedback(`Abandon ! La réponse était ${currentCountry.code} (${currentCountry.name})`, 'text-amber-400');
            
            gameHistory.push({
                country: currentCountry,
                userAnswer: "Abandon",
                correct: false,
                pts: 0,
                hint: hintUsed,
                plateHTML: currentPlateHTML // On mémorise la plaque exacte
            });

            handleScoreUpdate(0);
        }

        function showFeedback(text, colorClass) {
            const feedback = document.getElementById('feedback-message');
            feedback.innerText = text;
            feedback.className = `absolute bottom-2 text-xs font-bold ${colorClass} text-center px-4`;
            feedback.classList.remove('hidden');
        }

        function handleScoreUpdate(pointsGained) {
            score += pointsGained;
            document.getElementById('score-display').innerText = formatScore(score);

            if (pointsGained > 0) {
                if (navigator.vibrate) navigator.vibrate(40);
            } else {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }

            setTimeout(loadNextPlate, gameMode === 'easy' ? 1000 : 2200);
        }

        // Fonction pour afficher/masquer (toggle) la plaque au clic
        function toggleHistoryPlate(containerId) {
            const element = document.getElementById(containerId);
            if (element) {
                element.classList.toggle('hidden');
            }
        }

        function endGame() {
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = formatScore(score);

            const historyContainer = document.getElementById('dashboard-history');
            historyContainer.innerHTML = '';

            gameHistory.forEach((item, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = "flex flex-col gap-1.5";

                const row = document.createElement('button');
                row.className = `w-full text-left p-3 rounded-xl border flex items-center justify-between gap-3 transition-colors cursor-pointer active:scale-[0.99] ${item.correct ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-300 hover:bg-emerald-500/20' : 'bg-rose-500/10 border-rose-500/20 text-rose-300 hover:bg-rose-500/20'}`;
                
                let statusIcon = item.correct ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' : '<i class="fa-solid fa-circle-xmark text-rose-400"></i>';
                if (item.hint && item.correct) {
                    statusIcon = '<i class="fa-solid fa-lightbulb text-amber-400 animate-pulse"></i>';
                }

                row.innerHTML = `
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <span class="text-xs font-bold text-slate-500">${index + 1}</span>
                        <span class="text-base">${statusIcon}</span>
                        <div class="flex flex-col min-w-0">
                            <span class="font-bold text-slate-200 truncate">${item.country.flag} ${item.country.name}</span>
                            <span class="text-[11px] text-slate-400 truncate">Ta réponse : <span class="font-mono uppercase">${item.userAnswer}</span></span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0">
                        <div class="text-right font-black text-sm text-slate-300">
                            +${item.pts}
                        </div>
                        <i class="fa-solid fa-chevron-down text-slate-500 text-xs"></i>
                    </div>
                `;

                // Zone contenant la plaque cachée par défaut
                const platePreviewContainer = document.createElement('div');
                platePreviewContainer.id = `plate-preview-${index}`;
                platePreviewContainer.className = "hidden px-2 pb-2 pt-0.5 bg-slate-950/40 rounded-xl border border-slate-800/50";
                platePreviewContainer.innerHTML = item.plateHTML;

                row.onclick = () => toggleHistoryPlate(`plate-preview-${index}`);

                wrapper.appendChild(row);
                wrapper.appendChild(platePreviewContainer);
                historyContainer.appendChild(wrapper);
            });
        }
    </script>
</body>
</html>
