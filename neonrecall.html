<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Neon Recall 🧠</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #020617; color: #f8fafc; touch-action: none; overflow: hidden; position: fixed; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        canvas { display: block; background: #010409; border-radius: 1.5rem; width: 95vw; max-width: 420px; height: 95vw; max-height: 420px; border: 2px solid rgba(34, 211, 238, 0.2); }
        .timer-bar { width: 100%; height: 4px; background: #1e293b; border-radius: 2px; margin-top: 10px; overflow: hidden; }
        #timer-fill { width: 0%; height: 100%; background: #22d3ee; transition: width 0.1s linear; }
    </style>
</head>
<body class="px-4 py-10">

    <div class="w-full max-w-md flex flex-col items-center mb-6">
        <div class="w-full flex items-center justify-between mb-4">
            <a href="index.html" class="w-10 h-10 glass rounded-xl flex items-center justify-center text-slate-400 relative z-50">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="glass px-6 py-2 rounded-xl border border-cyan-500/30">
                <span id="lvl-display" class="font-black text-xl text-cyan-400 uppercase italic">Niveau 1</span>
            </div>
        </div>
        <div class="timer-bar"><div id="timer-fill"></div></div>
    </div>

    <div class="relative">
        <canvas id="recallCanvas"></canvas>
        <div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-50 glass rounded-[1.5rem]">
            <h2 id="title" class="text-3xl font-black mb-2 text-cyan-400 uppercase italic">Neon Recall</h2>
            <p id="msg" class="text-slate-400 mb-8 text-sm">Mémorise les cases éclairées !</p>
            <button id="startBtn" class="bg-cyan-500 text-slate-900 px-12 py-4 rounded-2xl font-black shadow-lg shadow-cyan-500/40 active:scale-95 transition-all uppercase italic">Scanner</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('recallCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const lvlDisplay = document.getElementById('lvl-display');
        const startBtn = document.getElementById('startBtn');
        const timerFill = document.getElementById('timer-fill');

        canvas.width = 500; canvas.height = 500;

        let level = 1;
        let gridSize = 3; 
        let targets = [];
        let userChoices = [];
        let isMemorizing = false;
        let gameActive = false;

        function initLevel() {
            // La grille s'agrandit tous les 2 niveaux (max 10x10)
            gridSize = Math.min(10, 3 + Math.floor((level - 1) / 2));
            
            // Nombre de cases : commence à 3, augmente avec le niveau, mais bloqué à 10 maximum
            let numTiles = Math.min(10, 2 + level); 
            
            targets = [];
            userChoices = [];
            
            // Générer des cibles uniques dans la grille actuelle
            while(targets.length < numTiles) {
                let r = Math.floor(Math.random() * (gridSize * gridSize));
                if(!targets.includes(r)) targets.push(r);
            }

            overlay.classList.add('hidden');
            lvlDisplay.innerText = "Niveau " + level;
            startMemorization();
        }
        
        async function startMemorization() {
            isMemorizing = true;
            gameActive = false;
            
            // Animation de la barre de timer (3 secondes)
            timerFill.style.transition = "none";
            timerFill.style.width = "100%";
            setTimeout(() => {
                timerFill.style.transition = "width 3s linear";
                timerFill.style.width = "0%";
            }, 50);

            draw(true); // On dessine toutes les cibles

            await new Promise(r => setTimeout(r, 3000));
            
            isMemorizing = false;
            gameActive = true;
            draw(); // On efface tout
        }

        function draw(showTargets = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const padding = 10;
            const tileSize = (canvas.width - padding * 2) / gridSize;

            for(let i = 0; i < gridSize * gridSize; i++) {
                const x = padding + (i % gridSize) * tileSize;
                const y = padding + Math.floor(i / gridSize) * tileSize;

                ctx.strokeStyle = "rgba(34, 211, 238, 0.1)";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(x + 2, y + 2, tileSize - 4, tileSize - 4);

                // Affichage pendant la phase de mémorisation
                if(showTargets && targets.includes(i)) {
                    ctx.fillStyle = "#22d3ee";
                    ctx.shadowBlur = 15; ctx.shadowColor = "#22d3ee";
                    ctx.fillRect(x + 5, y + 5, tileSize - 10, tileSize - 10);
                    ctx.shadowBlur = 0;
                }
                
                // Affichage des sélections de l'utilisateur
                if(userChoices.includes(i)) {
                    const isCorrect = targets.includes(i);
                    ctx.fillStyle = isCorrect ? "rgba(34, 211, 238, 0.7)" : "#f43f5e";
                    ctx.fillRect(x + 5, y + 5, tileSize - 10, tileSize - 10);
                }
            }
        }

        function handleClick(e) {
            if(!gameActive || isMemorizing) return;

            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const mouseX = (clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (clientY - rect.top) * (canvas.height / rect.height);

            const padding = 10;
            const tileSize = (canvas.width - padding * 2) / gridSize;
            
            const col = Math.floor((mouseX - padding) / tileSize);
            const row = Math.floor((mouseY - padding) / tileSize);
            const id = row * gridSize + col;

            if(col >= 0 && col < gridSize && row >= 0 && row < gridSize) {
                if(!userChoices.includes(id)) checkChoice(id);
            }
        }

        function checkChoice(id) {
            if(targets.includes(id)) {
                userChoices.push(id);
                if (navigator.vibrate) navigator.vibrate(20);
                draw();

                if(userChoices.length === targets.length) {
                    gameActive = false;
                    setTimeout(() => {
                        level++;
                        document.getElementById('title').innerText = "Signal Capturé";
                        document.getElementById('msg').innerText = "La grille s'agrandit...";
                        overlay.classList.remove('hidden');
                    }, 500);
                }
            } else {
                userChoices.push(id); // Pour montrer l'erreur en rouge
                draw();
                gameOver();
            }
        }

        function gameOver() {
            gameActive = false;
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            setTimeout(() => {
                document.getElementById('title').innerText = "Échec";
                document.getElementById('msg').innerText = `Mémoire saturée au Niveau ${level}`;
                level = 1;
                overlay.classList.remove('hidden');
            }, 300);
        }

        startBtn.addEventListener('click', initLevel);
        canvas.addEventListener('mousedown', handleClick);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleClick(e); }, {passive: false});

        draw();
    </script>
</body>
</html>
