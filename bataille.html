<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>La Bataille - Score ⚔️</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nos Jeux">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .player-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .score-p1 { color: #60a5fa; text-shadow: 0 0 20px rgba(96, 165, 250, 0.3); }
        .score-p2 { color: #f87171; text-shadow: 0 0 20px rgba(248, 113, 113, 0.3); }
        
        .history-item {
            animation: slideIn 0.3s ease-out;
            border-left: 3px solid #60a5fa;
        }
        .history-item.winner-red { border-left-color: #f87171; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Animation Splash Screen */
        @keyframes sword-clash {
            0% { transform: scale(0.5) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(0deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-clash { animation: sword-clash 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes loading-bar {
            0% { width: 0%; left: 0; }
            50% { width: 100%; left: 0; }
            100% { width: 0%; left: 100%; }
        }
        .loading-progress {
            position: absolute;
            height: 100%;
            background: #f87171;
            animation: loading-bar 1.5s infinite ease-in-out;
            box-shadow: 0 0 15px #f87171;
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Splash Screen Bataille -->
    <div id="splash-screen" class="fixed inset-0 z-[100] bg-[#0f172a] flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="relative h-40 w-40 flex items-center justify-center animate-clash">
            <!-- Halo de combat -->
            <div class="absolute inset-0 bg-red-500/20 blur-3xl rounded-full animate-pulse"></div>
            <!-- Icône d'épées croisées (Visible et large) -->
            <svg viewBox="0 0 512 512" class="w-32 h-32 fill-amber-500 drop-shadow-[0_0_15px_rgba(245,158,11,0.5)]">
                <path d="M504.1 444.1L355.7 295.6l31.5-31.5c9.4-9.4 9.4-24.6 0-33.9s-24.6-9.4-33.9 0l-31.5 31.5L208 147.9l43.1-43.1c9.4-9.4 9.4-24.6 0-33.9s-24.6-9.4-33.9 0l-43.1 43.1L94.5 34.5c-21.9-21.9-57.3-21.9-79.2 0s-21.9 57.3 0 79.2l79.5 79.5-43.1 43.1c-9.4 9.4-9.4 24.6 0 33.9s24.6 9.4 33.9 0l43.1-43.1 113.8 113.8-31.5 31.5c-9.4 9.4-9.4 24.6 0 33.9s24.6 9.4 33.9 0l31.5-31.5L424.5 504c21.9 21.9 57.3 21.9 79.2 0s22.4-57.7.4-79.9zM110.3 126.5L34.5 50.7c-3.1-3.1-3.1-8.2 0-11.3s8.2-3.1 11.3 0l75.8 75.8-11.3 11.3zm311 311l75.8 75.8c3.1 3.1 3.1 8.2 0 11.3s-8.2 3.1-11.3 0l-75.8-75.8 11.3-11.3z"/>
            </svg>
        </div>
        
        <h2 class="mt-8 text-2xl font-bold uppercase tracking-[0.3em] text-white">À l'attaque !</h2>
        
        <div class="mt-6 w-48 h-1 bg-slate-800 rounded-full overflow-hidden relative border border-white/5">
            <div class="loading-progress"></div>
        </div>
    </div>

    <div class="container mx-auto px-4 pt-8 max-w-lg">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <a href="index.html" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Retour
            </a>
            <h1 class="text-2xl font-bold text-white tracking-tight">Bataille ⚔️</h1>
            <button onclick="confirmReset()" class="text-slate-500 hover:text-red-400 transition-colors">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>

        <!-- Configuration Section -->
        <div id="setup-section" class="glass p-8 rounded-[2.5rem] mb-8">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                <i class="fa-solid fa-user-group text-indigo-400"></i> Joueurs de la bataille
            </h2>
            <div class="space-y-4 mb-8">
                <div>
                    <label class="text-[10px] uppercase tracking-widest text-slate-500 font-bold ml-2">Joueur 1 (Bleu)</label>
                    <input type="text" id="name-p1" placeholder="Nom..."
                           class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl px-4 py-4 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-white transition-all">
                </div>
                <div>
                    <label class="text-[10px] uppercase tracking-widest text-slate-500 font-bold ml-2">Joueur 2 (Rouge)</label>
                    <input type="text" id="name-p2" placeholder="Nom..."
                           class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl px-4 py-4 mt-1 focus:outline-none focus:ring-2 focus:ring-red-500/50 text-white transition-all">
                </div>
            </div>
            <button onclick="startGame()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-5 rounded-2xl shadow-lg transition-all active:scale-95">
                Commencer le duel
            </button>
        </div>

        <!-- Game Section (Cachée par défaut) -->
        <div id="game-section" class="hidden">
            <!-- Duel Cards -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <!-- Joueur 1 -->
                <button onclick="addPoint(1)" class="player-card glass p-6 rounded-[2.5rem] flex flex-col items-center gap-4 active:scale-95 border-b-4 border-blue-500/50">
                    <span id="display-name-p1" class="text-slate-400 font-semibold uppercase text-[10px] tracking-widest truncate w-full text-center">Joueur 1</span>
                    <span id="score-1" class="text-6xl font-black score-p1">0</span>
                    <div class="bg-blue-500/10 text-blue-400 px-4 py-1 rounded-full text-[10px] font-bold">+1 POINT</div>
                </button>

                <!-- Joueur 2 -->
                <button onclick="addPoint(2)" class="player-card glass p-6 rounded-[2.5rem] flex flex-col items-center gap-4 active:scale-95 border-b-4 border-red-500/50">
                    <span id="display-name-p2" class="text-slate-400 font-semibold uppercase text-[10px] tracking-widest truncate w-full text-center">Joueur 2</span>
                    <span id="score-2" class="text-6xl font-black score-p2">0</span>
                    <div class="bg-red-500/10 text-red-400 px-4 py-1 rounded-full text-[10px] font-bold">+1 POINT</div>
                </button>
            </div>

            <!-- Historique -->
            <div class="glass rounded-3xl p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i> Historique
                    </h3>
                    <span id="total-rounds" class="text-xs text-slate-500 font-medium">0 manches</span>
                </div>
                
                <div id="history-list" class="space-y-3 max-h-[300px] overflow-y-auto pr-2 text-sm">
                    <div class="text-center py-10 text-slate-600 italic">
                        Aucune manche jouée
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Splash screen
        window.onload = function() {
            const splash = document.getElementById('splash-screen');
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 700);
            }, 1500);
        };

        let scores = { 1: 0, 2: 0 };
        let playerNames = { 1: "Joueur 1", 2: "Joueur 2" };
        let history = [];

        function startGame() {
            const p1 = document.getElementById('name-p1').value.trim() || "Joueur 1";
            const p2 = document.getElementById('name-p2').value.trim() || "Joueur 2";
            
            playerNames[1] = p1;
            playerNames[2] = p2;
            
            document.getElementById('display-name-p1').textContent = p1;
            document.getElementById('display-name-p2').textContent = p2;
            
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
        }

        function addPoint(playerNum) {
            scores[playerNum]++;
            document.getElementById(`score-${playerNum}`).textContent = scores[playerNum];
            
            const now = new Date();
            const timeStr = now.getHours() + ":" + String(now.getMinutes()).padStart(2, '0');
            
            history.unshift({
                num: playerNum,
                winner: playerNames[playerNum],
                time: timeStr
            });

            if (navigator.vibrate) navigator.vibrate(50);

            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            document.getElementById('total-rounds').textContent = history.length + " manches";

            if (history.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-slate-600 italic">Aucune manche jouée</div>`;
                return;
            }

            list.innerHTML = history.map(item => `
                <div class="glass px-4 py-3 rounded-xl flex justify-between items-center history-item ${item.num === 2 ? 'winner-red' : ''}">
                    <span class="font-bold ${item.num === 1 ? 'text-blue-400' : 'text-red-400'}">
                        ${item.winner} gagne
                    </span>
                    <span class="text-slate-500 text-[10px] font-medium">${item.time}</span>
                </div>
            `).join('');
        }

        function confirmReset() {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 flex items-center justify-center bg-black/80 z-[100] px-4';
            modal.innerHTML = `
                <div class="glass p-8 rounded-[2rem] max-w-sm w-full text-center">
                    <div class="w-16 h-16 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                        <i class="fa-solid fa-rotate-left"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">Tout recommencer ?</h3>
                    <p class="text-slate-400 text-sm mb-6">Les noms, scores et l'historique seront effacés.</p>
                    <div class="flex gap-4">
                        <button id="cancel-reset" class="flex-1 bg-slate-700 py-3 rounded-xl font-semibold">Non</button>
                        <button id="confirm-reset" class="flex-1 bg-red-500 py-3 rounded-xl font-semibold text-white">Oui</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            document.getElementById('cancel-reset').onclick = () => modal.remove();
            document.getElementById('confirm-reset').onclick = () => location.reload();
        }
    </script>
</body>
</html>
