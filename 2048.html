<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>2048 - Arcade 🧩</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            touch-action: none;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 2em;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .game-container {
            width: 90vw;
            max-width: 400px;
            margin: 0 auto;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 1.5rem;
            aspect-ratio: 1 / 1;
            width: 100%;
        }

        .tile {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.8rem;
            transition: all 0.1s ease-in-out;
            user-select: none;
            animation: appear 0.2s ease;
        }

        /* Ajustement de la taille du texte pour les grands nombres */
        .tile[data-value="128"], .tile[data-value="256"], .tile[data-value="512"] { font-size: 1.4rem; }
        .tile[data-value="1024"], .tile[data-value="2048"] { font-size: 1.1rem; }

        @keyframes appear {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        .tile-empty { background: rgba(255, 255, 255, 0.05); }
        .tile-2 { background: #e2e8f0; color: #0f172a; }
        .tile-4 { background: #cbd5e1; color: #0f172a; }
        .tile-8 { background: #fb923c; color: white; }
        .tile-16 { background: #f97316; color: white; }
        .tile-32 { background: #ea580c; color: white; }
        .tile-64 { background: #dc2626; color: white; }
        .tile-128 { background: #facc15; color: #0f172a; box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
        .tile-256 { background: #eab308; color: #0f172a; box-shadow: 0 0 20px rgba(234, 179, 8, 0.4); }
        .tile-512 { background: #d97706; color: white; box-shadow: 0 0 25px rgba(217, 119, 6, 0.4); }
        .tile-1024 { background: #6366f1; color: white; }
        .tile-2048 { background: #4f46e5; color: white; box-shadow: 0 0 30px rgba(79, 70, 229, 0.6); }
    </style>
</head>
<body class="py-10">

    <div class="w-full max-w-[400px] px-4 flex items-center justify-between mb-6">
        <a href="index.html" class="w-12 h-12 glass rounded-2xl flex items-center justify-center text-slate-400 active:scale-90 transition-transform">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="flex flex-col items-end">
            <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Score</span>
            <div class="glass px-5 py-1 rounded-xl border-orange-500/20">
                <span id="score" class="font-bold text-2xl text-orange-400">0</span>
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="glass p-2 rounded-[2.5rem] relative">
            <div id="grid" class="grid-container"></div>

            <div id="game-over" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-[2.5rem] flex flex-col items-center justify-center text-center p-6 z-10">
                <div class="w-20 h-20 bg-orange-500/20 text-orange-500 rounded-full flex items-center justify-center text-3xl mb-4">
                    <i class="fa-solid fa- puzzle-piece"></i>
                </div>
                <h2 class="text-3xl font-bold text-white mb-1">Bloqué !</h2>
                <p id="final-score-msg" class="text-slate-400 mb-8">Plus de mouvements possibles.</p>
                <button onclick="resetGame()" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-orange-500/30 active:scale-95 transition-transform">
                    Essayer encore
                </button>
            </div>
        </div>
    </div>

    <div class="mt-8 text-slate-500 text-sm flex items-center gap-3 animate-pulse">
        <i class="fa-solid fa-hand-pointer"></i>
        <span>Glisse ton doigt pour jouer</span>
    </div>

    <script>
        let grid = [];
        let score = 0;
        const size = 4;
        const gridDisplay = document.getElementById('grid');
        const scoreDisplay = document.getElementById('score');
        const gameOverDisplay = document.getElementById('game-over');

        function init() {
            grid = Array(size * size).fill(0);
            score = 0;
            scoreDisplay.innerText = score;
            gameOverDisplay.classList.add('hidden');
            addRandomTile();
            addRandomTile();
            render();
        }

        function addRandomTile() {
            let emptyTiles = grid.map((val, index) => val === 0 ? index : null).filter(val => val !== null);
            if (emptyTiles.length > 0) {
                let randomPos = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
                grid[randomPos] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function render() {
            gridDisplay.innerHTML = '';
            grid.forEach(val => {
                const tile = document.createElement('div');
                tile.className = `tile ${val === 0 ? 'tile-empty' : 'tile-' + val}`;
                tile.setAttribute('data-value', val);
                tile.innerText = val === 0 ? '' : val;
                gridDisplay.appendChild(tile);
            });
        }

        function slide(row) {
            let filteredRow = row.filter(num => num !== 0);
            for (let i = 0; i < filteredRow.length - 1; i++) {
                if (filteredRow[i] === filteredRow[i + 1]) {
                    filteredRow[i] *= 2;
                    score += filteredRow[i];
                    filteredRow[i + 1] = 0;
                    if (navigator.vibrate) navigator.vibrate(15);
                }
            }
            filteredRow = filteredRow.filter(num => num !== 0);
            while (filteredRow.length < size) filteredRow.push(0);
            return filteredRow;
        }

        function move(direction) {
            let oldGrid = [...grid];
            for (let i = 0; i < size; i++) {
                let row = [];
                if (direction === 'LEFT' || direction === 'RIGHT') {
                    for (let j = 0; j < size; j++) row.push(grid[i * size + j]);
                    if (direction === 'RIGHT') row.reverse();
                    row = slide(row);
                    if (direction === 'RIGHT') row.reverse();
                    for (let j = 0; j < size; j++) grid[i * size + j] = row[j];
                } else {
                    for (let j = 0; j < size; j++) row.push(grid[j * size + i]);
                    if (direction === 'DOWN') row.reverse();
                    row = slide(row);
                    if (direction === 'DOWN') row.reverse();
                    for (let j = 0; j < size; j++) grid[j * size + i] = row[j];
                }
            }
            if (JSON.stringify(oldGrid) !== JSON.stringify(grid)) {
                addRandomTile();
                scoreDisplay.innerText = score;
                render();
                checkGameOver();
            }
        }

        function checkGameOver() {
            if (!grid.includes(0)) {
                let possible = false;
                for (let i = 0; i < size * size; i++) {
                    if (i % size < size - 1 && grid[i] === grid[i + 1]) possible = true;
                    if (i < size * (size - 1) && grid[i] === grid[i + size]) possible = true;
                }
                if (!possible) gameOverDisplay.classList.remove('hidden');
            }
        }

        function resetGame() { init(); }

        // Touch Events
        let startX, startY;
        document.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        document.addEventListener('touchend', e => {
            if (!startX || !startY) return;
            let dx = e.changedTouches[0].clientX - startX;
            let dy = e.changedTouches[0].clientY - startY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) move(dx > 0 ? 'RIGHT' : 'LEFT');
            } else {
                if (Math.abs(dy) > 30) move(dy > 0 ? 'DOWN' : 'UP');
            }
            startX = startY = null;
        });

        // Keyboard
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') move('LEFT');
            if (e.key === 'ArrowRight') move('RIGHT');
            if (e.key === 'ArrowUp') move('UP');
            if (e.key === 'ArrowDown') move('DOWN');
        });

        init();
    </script>
</body>
</html>
