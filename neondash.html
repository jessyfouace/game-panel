<script>
    const canvas = document.getElementById('launchCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = 400; canvas.height = 300;

    let gameState = 'IDLE'; 
    let coins = 0;
    let distance = 0;
    let powerMeter = 0;
    let powerDir = 1;
    let speed = 0;
    
    // Upgrades équilibrés pour la vitesse
    let stats = {
        power: { lvl: 1, cost: 50, val: 25 }, // Augmenté de 15 à 25
        aero: { lvl: 1, cost: 75, val: 0.975 } // Friction plus forte (0.985 -> 0.975) pour s'arrêter plus vite
    };

    let cube = { x: 50, y: 220, w: 30, h: 30 };
    let stars = [];

    for(let i=0; i<50; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2});

    function updateUI() {
        document.getElementById('coins').innerText = Math.floor(coins);
        document.getElementById('pwr-lvl').innerText = "Niv. " + stats.power.lvl;
        document.getElementById('pwr-cost').innerText = stats.power.cost + " 🪙";
        document.getElementById('aero-lvl').innerText = "Niv. " + stats.aero.lvl;
        document.getElementById('aero-cost').innerText = stats.aero.cost + " 🪙";
    }

    function launch() {
        if(gameState !== 'IDLE') return;
        // On booste le calcul de la vitesse initiale
        speed = (powerMeter / 100) * stats.power.val;
        gameState = 'FLYING';
        document.getElementById('launch-ui').classList.add('hidden');
    }

    function resetToLaunch() {
        gameState = 'IDLE';
        distance = 0;
        speed = 0;
        document.getElementById('launch-ui').classList.remove('hidden');
        document.getElementById('shop-ui').classList.add('hidden');
    }

    function buyUpgrade(type) {
        let u = stats[type];
        if(coins >= u.cost) {
            coins -= u.cost;
            u.lvl++;
            if(type === 'power') { u.val += 5; u.cost = Math.floor(u.cost * 1.5); }
            else { u.val += 0.001; u.cost = Math.floor(u.cost * 1.7); }
            updateUI();
            if (navigator.vibrate) navigator.vibrate(20);
        }
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if(gameState === 'IDLE') {
            powerMeter += 4 * powerDir; // Jauge un peu plus rapide
            if(powerMeter >= 100 || powerMeter <= 0) powerDir *= -1;
            document.getElementById('power-inner').style.height = powerMeter + "%";
        }

        // Background - Les étoiles filent plus vite
        ctx.fillStyle = "#fff";
        stars.forEach(s => {
            if(gameState === 'FLYING') s.x -= speed * 1.2; // Multiplicateur de sensation de vitesse
            if(s.x < 0) s.x = canvas.width;
            ctx.fillRect(s.x, s.y, s.s, s.s);
        });

        // Sol dynamique
        ctx.fillStyle = "rgba(34, 211, 238, 0.2)";
        ctx.fillRect(0, 250, canvas.width, 50);

        if(gameState === 'FLYING') {
            speed *= stats.aero.val; 
            distance += speed * 2; // On double la progression de distance pour que le score grimpe vite
            
            // On arrête le cube dès qu'il devient trop lent (0.5 au lieu de 0.1)
            if(speed < 0.5) {
                speed = 0;
                gameState = 'SHOP';
                let reward = Math.floor(distance / 5); // Plus généreux en pièces
                coins += reward;
                document.getElementById('dist-res').innerText = Math.floor(distance) + " m";
                document.getElementById('shop-ui').classList.remove('hidden');
                updateUI();
            }
        }

        // Dessin Cube avec effet de trainée si rapide
        ctx.save();
        ctx.translate(cube.x, cube.y);
        if(gameState === 'FLYING') {
            ctx.rotate(distance * 0.1);
            // Effet visuel de vitesse (étirement)
            let stretch = 1 + (speed / 50);
            ctx.scale(stretch, 1 / stretch);
        }
        ctx.fillStyle = "#22d3ee";
        ctx.shadowBlur = speed > 10 ? 20 : 10; 
        ctx.shadowColor = "#22d3ee";
        ctx.fillRect(-cube.w/2, -cube.h/2, cube.w, cube.h);
        ctx.restore();

        if(gameState === 'FLYING') {
            ctx.fillStyle = "#fff";
            ctx.font = "900 24px Outfit";
            ctx.textAlign = "center";
            ctx.fillText(Math.floor(distance) + " m", canvas.width/2, 60);
        }

        requestAnimationFrame(gameLoop);
    }

    updateUI();
    gameLoop();
</script>
