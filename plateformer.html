<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Overdrive: Fixed & Final ⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #020617; margin: 0; overflow: hidden; touch-action: none; user-select: none; }
        canvas { display: block; }
        .hud { position: fixed; top: 20px; left: 20px; z-index: 100; pointer-events: none; width: calc(100% - 40px); }
        .controls { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 30px; z-index: 100; }
        .btn { width: 75px; height: 75px; background: rgba(255,255,255,0.05); border-radius: 22px; display: flex; align-items: center; justify-content: center; color: white; pointer-events: auto; backdrop-blur: 15px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .btn:active { background: rgba(99, 102, 241, 0.4); transform: scale(0.9); }
        .nav-btn { pointer-events: auto; transition: all 0.2s; cursor: pointer; }
        .nav-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div class="hud flex justify-between items-start">
        <div class="flex items-center gap-3">
            <a href="index.html" class="nav-btn bg-slate-800 w-11 h-11 rounded-2xl flex items-center justify-center border border-white/10 shadow-lg">
                <i class="fa-solid fa-house text-white text-sm"></i>
            </a>
            <div class="text-white">
                <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-[0.2em]">Secteur <span id="lvl-display">1</span></div>
                <div class="text-2xl font-black italic tracking-tighter"><span id="coin-count">0</span><span class="text-indigo-500 opacity-50">/</span><span id="coin-total">0</span></div>
            </div>
        </div>
        
        <button id="btn-mute" class="nav-btn bg-slate-800 w-11 h-11 rounded-2xl flex items-center justify-center border border-white/10 shadow-lg">
            <i id="mute-icon" class="fa-solid fa-volume-high text-white text-sm"></i>
        </button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <div class="flex gap-5">
            <div id="btn-left" class="btn"><i class="fa-solid fa-chevron-left text-2xl"></i></div>
            <div id="btn-right" class="btn"><i class="fa-solid fa-chevron-right text-2xl"></i></div>
        </div>
        <div id="btn-jump" class="btn"><i class="fa-solid fa-angles-up text-2xl text-indigo-300"></i></div>
    </div>

    <div id="screen" class="fixed inset-0 bg-slate-950/98 flex flex-col items-center justify-center z-[200] p-8 text-center backdrop-blur-sm">
        <div id="screen-icon" class="w-24 h-24 bg-indigo-600/10 rounded-[35px] border border-indigo-500/20 flex items-center justify-center mb-8 shadow-2xl">
            <i class="fa-solid fa-bolt-lightning text-4xl text-indigo-500"></i>
        </div>
        <h1 id="screen-title" class="text-6xl font-black text-white mb-3 italic tracking-tighter uppercase">NEON OVERDRIVE</h1>
        <p id="screen-desc" class="text-indigo-400/60 mb-12 text-sm uppercase tracking-[0.5em] font-medium">Capturez l'énergie</p>
        
        <div class="flex flex-col gap-4 w-full max-w-xs">
            <button id="screen-btn" class="bg-indigo-600 text-white w-full py-5 rounded-2xl font-black text-xl shadow-[0_15px_50px_rgba(79,70,229,0.4)] uppercase italic">Démarrer</button>
            <a href="index.html" id="home-btn" class="bg-slate-800 text-white w-full py-4 rounded-2xl font-bold text-sm border border-white/5 uppercase hidden">Retour Accueil</a>
        </div>
    </div>

    <div id="goal-msg" class="fixed top-24 left-1/2 -translate-x-1/2 opacity-0 bg-red-500 text-white px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-wider transition-all duration-300 z-[100]">Énergie Insuffisante !</div>

    <script>
        // --- AUDIO ENGINE ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let isMuted = false;
        let mainBgmTimeout = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx || isMuted && type !== 'win') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(); osc.stop(now + 0.2);
            } else if (type === 'coin') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(); osc.stop(now + 0.3);
            } else if (type === 'die') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(20, now + 0.5);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(); osc.stop(now + 0.5);
            }
        }

        function startBGM() {
            if (mainBgmTimeout) return;
            const loop = () => {
                if (!isMuted && audioCtx && gameState === 'PLAY') {
                    const now = audioCtx.currentTime;
                    const notes = [110, 110, 130, 110, 146, 110, 130, 123];
                    notes.forEach((n, i) => {
                        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                        o.type = 'sine'; o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(n, now + i * 0.25);
                        g.gain.setValueAtTime(0.02, now + i * 0.25);
                        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.25 + 0.2);
                        o.start(now + i * 0.25); o.stop(now + i * 0.25 + 0.2);
                    });
                }
                mainBgmTimeout = setTimeout(loop, 2000);
            };
            loop();
        }

        document.getElementById('btn-mute').onclick = () => {
            isMuted = !isMuted;
            document.getElementById('mute-icon').className = isMuted ? 'fa-solid fa-volume-xmark text-red-400 text-sm' : 'fa-solid fa-volume-high text-white text-sm';
        };

        // --- GAME ENGINE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.addEventListener('resize', resize); resize();

        let gameState = 'START', currentLevel = 1, coinsCollected = 0, cameraX = 0, cameraY = 0, shake = 0;
        const player = { x: 0, y: 0, w: 26, h: 26, vx: 0, vy: 0, speed: 6.5, jumpPower: -14.5, grounded: false, jumps: 0 };
        let keys = { left: false, right: false }, platforms = [], coins = [], traps = [], goal = { x: 0, y: 0, w: 60, h: 90 };

        function generateLevel(lvl) {
            platforms = []; coins = []; traps = []; coinsCollected = 0;
            player.vx = player.vy = player.jumps = 0; player.x = 100; player.y = canvas.height - 300;
            cameraX = player.x; cameraY = player.y;
            
            platforms.push({ x: 0, y: canvas.height - 150, w: 450, h: 600, type: 'solid', moving: false });
            let curX = 500; let curY = canvas.height - 150;
            const levelLength = 12 + (lvl * 2);

            for (let i = 0; i < levelLength; i++) {
                let gap = 140 + Math.random() * 80;
                let vGap = (Math.random() - 0.5) * 280;
                curX += gap; curY = Math.max(250, Math.min(canvas.height - 130, curY + vGap));
                let pW = 160 + Math.random() * 150;
                let isMoving = Math.random() > 0.6;
                
                let p = { x: curX, y: curY, w: pW, h: 700, type: (Math.random() > 0.85) ? 'fall' : 'solid', timer: 0, moving: isMoving, baseX: curX, offset: 0, dir: 1, speed: 1.5 + Math.random() };
                platforms.push(p);

                let hasTrap = i > 1 && Math.random() > 0.5;
                if (hasTrap) traps.push({ relX: 30 + Math.random() * (pW - 70), w: 40, h: 15, parent: p });
                coins.push({ parent: p, relX: pW/2, relY: hasTrap ? 130 : 45, active: true });
                curX += pW;
            }
            goal.x = curX + 100; goal.y = curY - 90;
            document.getElementById('coin-total').innerText = coins.length;
            document.getElementById('coin-count').innerText = 0;
        }

        function update() {
            if (gameState !== 'PLAY') return;
            if (shake > 0) shake *= 0.9;
            if (keys.left) player.vx = -player.speed; else if (keys.right) player.vx = player.speed; else player.vx *= 0.85;
            player.vy += 0.8; player.x += player.vx; player.y += player.vy;

            player.grounded = false;
            platforms.forEach(p => {
                if (p.timer === -1) return;
                if (p.moving) { p.offset += p.dir * p.speed; if (Math.abs(p.offset) > 100) p.dir *= -1; p.x = p.baseX + p.offset; }
                if (player.x < p.x + p.w && player.x + player.w > p.x && player.y < p.y + p.h && player.y + player.h > p.y) {
                    if (player.vy > 0 && player.y + player.h <= p.y + player.vy + 10) {
                        player.y = p.y - player.h; player.vy = 0; player.grounded = true; player.jumps = 0;
                        if (p.moving) player.x += p.dir * p.speed; if (p.type === 'fall' && p.timer === 0) p.timer = Date.now();
                    } else if (player.vx > 0 && player.x < p.x) player.x = p.x - player.w; else if (player.vx < 0 && player.x > p.x) player.x = p.x + p.w;
                }
                if (p.timer > 0 && Date.now() - p.timer > 800) p.timer = -1;
            });

            coins.forEach(c => {
                if (c.active) {
                    let cx = c.parent.x + c.relX; let cy = c.parent.y - c.relY;
                    if (Math.abs(player.x + player.w/2 - cx) < 40 && Math.abs(player.y + player.h/2 - cy) < 40) {
                        c.active = false; coinsCollected++; playSound('coin');
                        document.getElementById('coin-count').innerText = coinsCollected;
                    }
                }
            });

            traps.forEach(t => {
                let tx = t.parent.x + t.relX; let ty = t.parent.y - t.h;
                if (player.x < tx + t.w && player.x + player.w > tx && player.y < ty + t.h && player.y + player.h > ty) die();
            });

            if (player.y > canvas.height + 500) die();
            if (player.x + player.w > goal.x && player.x < goal.x + goal.w && player.y + player.h > goal.y && player.y < goal.y + goal.h) {
                if (coinsCollected >= coins.length) win(); else document.getElementById('goal-msg').style.opacity = 1;
            } else document.getElementById('goal-msg').style.opacity = 0;

            cameraX += (player.x - cameraX - canvas.width/3) * 0.1; cameraY += (player.y - cameraY - canvas.height/1.8) * 0.1;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.save();
            if (shake > 0) ctx.translate(Math.random()*shake - shake/2, Math.random()*shake - shake/2);
            ctx.translate(-cameraX, -cameraY);

            ctx.fillStyle = (coinsCollected >= coins.length) ? '#10b981' : '#1e293b';
            ctx.shadowBlur = 20; ctx.shadowColor = ctx.fillStyle; ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

            platforms.forEach(p => {
                if (p.timer === -1) return;
                ctx.fillStyle = p.type === 'fall' ? '#f59e0b' : '#1e293b';
                ctx.shadowBlur = 15; ctx.shadowColor = '#4f46e533'; ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = p.moving ? '#818cf8' : '#4f46e5'; ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            traps.forEach(t => {
                let tx = t.parent.x + t.relX; let ty = t.parent.y - t.h;
                ctx.fillStyle = '#f43f5e'; ctx.shadowBlur = 10;
                for(let i=0; i<t.w; i+=10) { ctx.beginPath(); ctx.moveTo(tx+i, ty+t.h); ctx.lineTo(tx+i+5, ty); ctx.lineTo(tx+i+10, ty+t.h); ctx.fill(); }
            });

            ctx.fillStyle = '#fbbf24'; ctx.shadowBlur = 20;
            coins.forEach(c => { if (c.active) { ctx.beginPath(); ctx.arc(c.parent.x + c.relX, c.parent.y - c.relY, 10, 0, Math.PI*2); ctx.fill(); } });

            ctx.fillStyle = '#6366f1'; ctx.shadowBlur = 30; ctx.shadowColor = '#6366f1';
            ctx.fillRect(player.x, player.y, player.w, player.h);

            ctx.restore(); update(); requestAnimationFrame(draw);
        }

        function die() { shake = 25; gameState = 'DEAD'; playSound('die'); document.getElementById('home-btn').classList.remove('hidden'); showS('CRASH SYSTÈME', 'Collision détectée', 'RÉESSAYER'); }
        function win() { gameState = 'WIN'; document.getElementById('home-btn').classList.add('hidden'); showS('SUCCÈS', 'Secteur débloqué', 'CONTINUER'); }
        function showS(t, d, b) { document.getElementById('screen-title').innerText = t; document.getElementById('screen-desc').innerText = d; document.getElementById('screen-btn').innerText = b; document.getElementById('screen').classList.remove('hidden'); }

        document.getElementById('screen-btn').onclick = () => {
            initAudio(); startBGM();
            if (gameState === 'WIN') currentLevel++;
            document.getElementById('screen').classList.add('hidden');
            document.getElementById('lvl-display').innerText = currentLevel;
            generateLevel(currentLevel); gameState = 'PLAY';
        };

        const setup = (id, k) => {
            const b = document.getElementById(id);
            const start = (e) => { e.preventDefault(); if (k === 'jump' && player.jumps < 2 && gameState === 'PLAY') { player.vy = player.jumpPower; player.jumps++; playSound('jump'); } keys[k] = true; };
            b.addEventListener('touchstart', start); b.addEventListener('mousedown', start);
            b.addEventListener('touchend', () => keys[k] = false); b.addEventListener('mouseup', () => keys[k] = false);
        };
        setup('btn-left', 'left'); setup('btn-right', 'right'); setup('btn-jump', 'jump');

        window.addEventListener('keydown', e => {
            if (e.key === 'q' || e.code === 'ArrowLeft') keys.left = true;
            if (e.key === 'd' || e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'Space' || e.code === 'ArrowUp') { if (player.jumps < 2 && gameState === 'PLAY') { player.vy = player.jumpPower; player.jumps++; playSound('jump'); } e.preventDefault(); }
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'q' || e.code === 'ArrowLeft') keys.left = false;
            if (e.key === 'd' || e.code === 'ArrowRight') keys.right = false;
        });

        generateLevel(1); draw();
    </script>
</body>
</html>
