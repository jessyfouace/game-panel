<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Memory - Arcade 🧠</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            touch-action: manipulation;
            min-h-screen: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Grille de jeu */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
            perspective: 1000px;
        }

        /* Système de carte 3D */
        .card {
            aspect-ratio: 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            font-size: 1.5rem;
        }

        .card-front {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.2);
        }

        .card-back {
            background: rgba(236, 72, 153, 0.2); /* Rose pour le thème Memory */
            border: 1px solid rgba(236, 72, 153, 0.4);
            color: #ec4899;
            transform: rotateY(180deg);
        }

        .card.matched .card-back {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.4);
            color: #22c55e;
        }
    </style>
</head>
<body class="py-8 px-4">

    <div class="w-full max-w-md flex items-center justify-between mb-8">
        <a href="index.html" class="w-12 h-12 glass rounded-2xl flex items-center justify-center text-slate-400 active:scale-90 transition-transform">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="flex gap-4">
            <div class="glass px-4 py-2 rounded-xl text-center">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Coups</p>
                <p id="moves" class="font-bold text-xl text-pink-400">0</p>
            </div>
            <div class="glass px-4 py-2 rounded-xl text-center">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Paires</p>
                <p id="matches" class="font-bold text-xl text-emerald-400">0</p>
            </div>
        </div>
    </div>

    <div id="game-grid" class="memory-grid mb-8">
        </div>

    <button onclick="initGame()" class="glass px-8 py-4 rounded-2xl font-bold text-pink-400 flex items-center gap-3 active:scale-95 transition-all">
        <i class="fa-solid fa-rotate-right"></i>
        Nouvelle partie
    </button>

    <div id="victory-screen" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="w-24 h-24 bg-pink-500/20 text-pink-500 rounded-full flex items-center justify-center text-4xl mb-6 animate-bounce">
            <i class="fa-solid fa-trophy"></i>
        </div>
        <h2 class="text-4xl font-bold text-white mb-2">Bravo !</h2>
        <p id="final-stats" class="text-slate-400 mb-8 font-medium"></p>
        <button onclick="initGame()" class="w-full max-w-xs bg-pink-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-pink-500/20 active:scale-95 transition-transform">
            Rejouer
        </button>
    </div>

    <script>
        const icons = [
            'fa-ghost', 'fa-ghost',
            'fa-bolt', 'fa-bolt',
            'fa-bomb', 'fa-bomb',
            'fa-heart', 'fa-heart',
            'fa-star', 'fa-star',
            'fa-fire', 'fa-fire',
            'fa-moon', 'fa-moon',
            'fa-cloud', 'fa-cloud'
        ];

        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        let canFlip = true;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function createCard(iconClass, index) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.icon = iconClass;
            card.dataset.index = index;
            
            card.innerHTML = `
                <div class="card-face card-front">
                    <i class="fa-solid fa-question"></i>
                </div>
                <div class="card-face card-back">
                    <i class="fa-solid ${iconClass}"></i>
                </div>
            `;
            
            card.addEventListener('click', () => flipCard(card));
            return card;
        }

        function flipCard(card) {
            if (!canFlip || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            canFlip = false;
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.icon === card2.dataset.icon;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedCount++;
                document.getElementById('matches').innerText = matchedCount;
                flippedCards = [];
                canFlip = true;
                if (navigator.vibrate) navigator.vibrate([20, 50, 20]);
                
                if (matchedCount === icons.length / 2) {
                    showVictory();
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    canFlip = true;
                }, 1000);
            }
        }

        function showVictory() {
            const stats = document.getElementById('final-stats');
            stats.innerText = `Terminé en ${moves} coups !`;
            document.getElementById('victory-screen').classList.remove('hidden');
        }

        function initGame() {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            moves = 0;
            canFlip = true;
            document.getElementById('moves').innerText = '0';
            document.getElementById('matches').innerText = '0';
            document.getElementById('victory-screen').classList.add('hidden');

            const shuffledIcons = shuffle([...icons]);
            shuffledIcons.forEach((icon, index) => {
                grid.appendChild(createCard(icon, index));
            });
        }

        // Démarrage
        initGame();
    </script>
</body>
</html>
