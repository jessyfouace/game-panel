<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Simon Glow - Arcade 🌈</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            touch-action: none;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 2em;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Plateau circulaire */
        .simon-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.5);
            border: 8px solid rgba(30, 41, 59, 0.5);
        }

        .pad {
            width: 100%;
            height: 100%;
            border-radius: 40px;
            transition: all 0.2s;
            opacity: 0.4;
            cursor: pointer;
            position: relative;
        }

        /* Couleurs et Lueurs */
        .green  { background: #22c55e; border-radius: 100% 40px 40px 40px; }
        .red    { background: #ef4444; border-radius: 40px 100% 40px 40px; }
        .yellow { background: #eab308; border-radius: 40px 40px 40px 100%; }
        .blue   { background: #3b82f6; border-radius: 40px 40px 100% 40px; }

        .pad.active {
            opacity: 1;
            transform: scale(0.96);
            box-shadow: 0 0 40px currentColor;
            z-index: 10;
        }

        /* Centre du jeu */
        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #0f172a;
            border: 8px solid rgba(30, 41, 59, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        #level-display {
            font-weight: 800;
            font-size: 1.5rem;
            color: #f8fafc;
        }
    </style>
</head>
<body class="py-10">

    <div class="w-full max-w-md px-6 flex items-center justify-between mb-12">
        <a href="index.html" class="w-12 h-12 glass rounded-2xl flex items-center justify-center text-slate-400">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="glass px-6 py-2 rounded-2xl">
            <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Record</span>
            <div id="best-score" class="text-center font-bold text-indigo-400">0</div>
        </div>
        <div class="w-12"></div>
    </div>

    <div class="relative">
        <div class="simon-container">
            <div class="pad green" id="0" onclick="handlePadClick(0)"></div>
            <div class="pad red" id="1" onclick="handlePadClick(1)"></div>
            <div class="pad yellow" id="2" onclick="handlePadClick(2)"></div>
            <div class="pad blue" id="3" onclick="handlePadClick(3)"></div>
            
            <div class="center-hub glass">
                <span class="text-[10px] text-slate-500 uppercase font-bold">Niveau</span>
                <span id="level-display">--</span>
            </div>
        </div>
    </div>

    <div class="mt-16 flex flex-col items-center gap-6">
        <button id="start-btn" onclick="startGame()" class="bg-indigo-500 text-white px-12 py-4 rounded-2xl font-bold shadow-lg shadow-indigo-500/20 active:scale-95 transition-all">
            COMMENCER
        </button>
        <p id="status-text" class="text-slate-500 text-sm font-medium uppercase tracking-widest">Appuyez sur Start</p>
    </div>

    <script>
        let sequence = [];
        let playerSequence = [];
        let level = 0;
        let isWaitingForPlayer = false;
        let bestScore = localStorage.getItem('simonBest') || 0;

        document.getElementById('best-score').innerText = bestScore;

        // Configuration Audio (Synthé simple)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const frequencies = [261.6, 329.6, 392.0, 523.3]; // Notes C4, E4, G4, C5

        function playSound(index) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = frequencies[index];
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function activatePad(index) {
            const pad = document.getElementById(index.toString());
            pad.classList.add('active');
            playSound(index);
            if (navigator.vibrate) navigator.vibrate(20);
            
            setTimeout(() => {
                pad.classList.remove('active');
            }, 300);
        }

        async function playSequence() {
            isWaitingForPlayer = false;
            document.getElementById('status-text').innerText = "Regardez...";
            
            for (const colorIndex of sequence) {
                await new Promise(resolve => setTimeout(resolve, 600));
                activatePad(colorIndex);
            }
            
            isWaitingForPlayer = true;
            document.getElementById('status-text').innerText = "À vous !";
        }

        function startGame() {
            sequence = [];
            level = 0;
            document.getElementById('start-btn').classList.add('hidden');
            nextLevel();
        }

        function nextLevel() {
            level++;
            playerSequence = [];
            document.getElementById('level-display').innerText = level;
            sequence.push(Math.floor(Math.random() * 4));
            playSequence();
        }

        function handlePadClick(index) {
            if (!isWaitingForPlayer) return;

            activatePad(index);
            playerSequence.push(index);

            const currentStep = playerSequence.length - 1;

            if (playerSequence[currentStep] !== sequence[currentStep]) {
                gameOver();
                return;
            }

            if (playerSequence.length === sequence.length) {
                isWaitingForPlayer = false;
                setTimeout(nextLevel, 1000);
            }
        }

        function gameOver() {
            isWaitingForPlayer = false;
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            
            // Son d'erreur
            const osc = audioCtx.createOscillator();
            osc.frequency.value = 100;
            osc.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);

            document.getElementById('status-text').innerText = "PERDU !";
            document.getElementById('level-display').innerText = "!!";
            
            if (level - 1 > bestScore) {
                bestScore = level - 1;
                localStorage.setItem('simonBest', bestScore);
                document.getElementById('best-score').innerText = bestScore;
            }

            setTimeout(() => {
                document.getElementById('start-btn').classList.remove('hidden');
                document.getElementById('start-btn').innerText = "RÉESSAYER";
            }, 1000);
        }
    </script>
</body>
</html>
