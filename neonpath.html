<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Neon Path 🧭</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #020617; color: #f8fafc; touch-action: none; overflow: hidden; position: fixed; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        canvas { display: block; background: #010409; border-radius: 1.5rem; width: 95vw; max-width: 400px; border: 2px solid rgba(34, 211, 238, 0.2); cursor: crosshair; }
        .level-badge { background: linear-gradient(45deg, #06b6d4, #8b5cf6); }
    </style>
</head>
<body class="py-10 px-4">

    <div class="w-full max-w-md flex items-center justify-between mb-8">
        <a href="index.html" class="w-10 h-10 glass rounded-xl flex items-center justify-center text-slate-400"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="flex gap-3">
            <div class="glass px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-widest text-slate-400">
                Level <span id="lvl-display" class="text-white text-lg ml-1">1</span>
            </div>
        </div>
    </div>

    <div class="relative">
        <canvas id="pathCanvas"></canvas>
        <div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-50 glass rounded-[1.5rem]">
            <h2 id="title" class="text-3xl font-black mb-2 text-cyan-400 uppercase italic">Neon Path</h2>
            <p id="msg" class="text-slate-400 mb-8 text-sm">Relie le <span class="text-cyan-400 font-bold">Bleu</span> au <span class="text-purple-500 font-bold">Violet</span> sans t'arrêter !</p>
            <button onclick="initLevel()" class="bg-cyan-500 text-slate-900 px-12 py-4 rounded-2xl font-black shadow-lg shadow-cyan-500/30 active:scale-95 transition-all uppercase italic">Tracer le chemin</button>
        </div>
    </div>

    <script>
    const canvas = document.getElementById('pathCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    
    let gridSize = 8; // On commence plus petit mais plus dense
    let tileSize = 0;
    let level = 1;
    let grid = [];
    let path = [];
    let gameActive = false;
    let startNode, endNode;

    canvas.width = 400;
    canvas.height = 400;

    function initLevel() {
        // La grille grandit tous les 2 niveaux
        gridSize = 7 + Math.floor(level / 2);
        tileSize = canvas.width / gridSize;
        grid = [];
        path = [];
        gameActive = false;
        overlay.classList.add('hidden');

        // Création de la grille avec haute densité d'obstacles (35%)
        for(let y=0; y<gridSize; y++) {
            for(let x=0; x<gridSize; x++) {
                // On laisse une zone libre autour du départ et de l'arrivée
                let isEdge = (x === 0 || x === gridSize - 1);
                let rand = Math.random();
                let type = (!isEdge && rand < 0.35) ? 'block' : 'empty';
                grid.push({ x, y, type: type });
            }
        }

        // Points de départ et d'arrivée aléatoires sur les bords opposés pour varier
        startNode = { x: 0, y: Math.floor(Math.random() * gridSize) };
        endNode = { x: gridSize-1, y: Math.floor(Math.random() * gridSize) };
        
        getNode(startNode.x, startNode.y).type = 'start';
        getNode(endNode.x, endNode.y).type = 'end';

        document.getElementById('lvl-display').innerText = level;
        draw();
    }

    function getNode(x, y) { return grid.find(n => n.x === x && n.y === y); }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Background Grid
        ctx.strokeStyle = "rgba(34, 211, 238, 0.05)";
        ctx.lineWidth = 1;
        for(let i=0; i<=gridSize; i++) {
            ctx.beginPath(); ctx.moveTo(i*tileSize, 0); ctx.lineTo(i*tileSize, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i*tileSize); ctx.lineTo(canvas.width, i*tileSize); ctx.stroke();
        }

        grid.forEach(n => {
            if(n.type === 'block') {
                // Blocs style "mur" plus imposants
                ctx.fillStyle = "#1e293b";
                ctx.strokeStyle = "rgba(255,255,255,0.1)";
                ctx.lineWidth = 2;
                ctx.fillRect(n.x*tileSize+2, n.y*tileSize+2, tileSize-4, tileSize-4);
                ctx.strokeRect(n.x*tileSize+2, n.y*tileSize+2, tileSize-4, tileSize-4);
            } else if(n.type === 'start') {
                ctx.fillStyle = "#22d3ee";
                ctx.shadowBlur = 15; ctx.shadowColor = "#22d3ee";
                ctx.beginPath();
                ctx.arc(n.x*tileSize+tileSize/2, n.y*tileSize+tileSize/2, tileSize/3, 0, Math.PI*2);
                ctx.fill();
            } else if(n.type === 'end') {
                ctx.fillStyle = "#a855f7";
                ctx.shadowBlur = 15; ctx.shadowColor = "#a855f7";
                ctx.beginPath();
                ctx.arc(n.x*tileSize+tileSize/2, n.y*tileSize+tileSize/2, tileSize/3, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        });

        // Tracé du chemin
        if(path.length > 0) {
            ctx.beginPath();
            ctx.strokeStyle = "#22d3ee";
            ctx.lineWidth = tileSize/3;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.shadowBlur = 15; ctx.shadowColor = "#22d3ee";
            
            path.forEach((p, i) => {
                const cx = p.x * tileSize + tileSize/2;
                const cy = p.y * tileSize + tileSize/2;
                if(i === 0) ctx.moveTo(cx, cy);
                else ctx.lineTo(cx, cy);
            });
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
    }

    function handleMove(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const x = Math.floor((clientX - rect.left) / (rect.width / gridSize));
        const y = Math.floor((clientY - rect.top) / (rect.height / gridSize));

        if(x < 0 || x >= gridSize || y < 0 || y >= gridSize) return;

        const node = getNode(x, y);

        if(!gameActive && node && node.type === 'start') {
            gameActive = true;
            path = [{x, y}];
        }

        if(gameActive) {
            const last = path[path.length - 1];
            if(x !== last.x || y !== last.y) {
                // Vérifier si le mouvement est adjacent (pas de diagonale)
                const isAdjacent = Math.abs(x - last.x) + Math.abs(y - last.y) === 1;
                
                if(isAdjacent) {
                    // Collision mur ou soi-même
                    if(node.type === 'block' || path.some(p => p.x === x && p.y === y)) {
                        gameActive = false;
                        if (navigator.vibrate) navigator.vibrate(100);
                        document.getElementById('title').innerText = "Signal Perdu";
                        overlay.classList.remove('hidden');
                    } else {
                        path.push({x, y});
                        if(node.type === 'end') {
                            gameActive = false;
                            level++;
                            document.getElementById('title').innerText = "Niveau Complété";
                            overlay.classList.remove('hidden');
                        }
                        draw();
                    }
                }
            }
        }
    }

    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleMove(e); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, {passive: false});

    initLevel();
</script>
</body>
</html>
