<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Neon Stack Fix 🧱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #020617; color: #f8fafc; touch-action: none; overflow: hidden; position: fixed; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        canvas { display: block; background: #010409; border-radius: 1.5rem; width: 95vw; max-width: 400px; height: 65vh; border: 2px solid rgba(139, 92, 246, 0.3); }
    </style>
</head>
<body class="py-10 px-4">

    <div class="w-full max-w-md flex items-center justify-between mb-4 relative z-[100]">
        <a href="index.html" class="w-10 h-10 glass rounded-xl flex items-center justify-center text-slate-400"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="glass px-6 py-2 rounded-xl border border-purple-500/30">
            <span id="score-display" class="font-black text-2xl text-purple-400">0</span>
        </div>
    </div>

    <div class="relative">
        <canvas id="stackCanvas"></canvas>
        <div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-50 glass rounded-[1.5rem]">
            <h2 id="title" class="text-4xl font-black mb-2 text-purple-400 uppercase italic">Neon Stack</h2>
            <p id="msg" class="text-slate-400 mb-8 text-sm uppercase tracking-widest">Clique pour empiler</p>
            
            <div class="flex flex-col gap-3 w-full px-8">
                <button id="startBtn" class="bg-purple-600 text-white w-full py-4 rounded-2xl font-black shadow-lg shadow-purple-600/40 active:scale-95 transition-all uppercase italic text-lg">Démarrer</button>
                <a href="index.html" class="glass text-slate-300 w-full py-3 rounded-2xl font-bold active:scale-95 transition-all uppercase tracking-tight text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-house text-xs"></i> Accueil
                </a>
            </div>
        </div>
    </div>

    <script>
    const canvas = document.getElementById('stackCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreDisplay = document.getElementById('score-display');
    const startBtn = document.getElementById('startBtn');

    canvas.width = 400; canvas.height = 600;

    let gameActive = false;
    let score = 0;
    let speed = 4;
    let direction = 1;
    let hue = 260;
    let stack = [];
    let currentBlock = null;
    const blockHeight = 35;

    // AUDIO ENGINE
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'stack') {
            const freq = 200 + (score * 20); 
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(); osc.stop(now + 0.2);
        } else if (type === 'gameOver') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(20, now + 0.6);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
            osc.start(); osc.stop(now + 0.6);
        }
    }

    function init() {
        stack = [{ x: 100, y: canvas.height - blockHeight, w: 200, color: `hsl(260, 70%, 50%)` }];
        draw();
    }

    function startGame() {
        score = 0; hue = 260; speed = 4;
        stack = [{ x: 100, y: canvas.height - blockHeight, w: 200, color: `hsl(260, 70%, 50%)` }];
        scoreDisplay.innerText = "0";
        overlay.classList.add('hidden');
        spawnBlock();
        gameActive = true;
        requestAnimationFrame(gameLoop);
    }

    function spawnBlock() {
        const last = stack[stack.length - 1];
        const startLeft = Math.random() > 0.5;
        currentBlock = {
            x: startLeft ? 0 : canvas.width - last.w,
            y: last.y - blockHeight,
            w: last.w,
            color: `hsl(${hue += 12}, 70%, 55%)`
        };
        direction = startLeft ? 1 : -1;
        speed = Math.min(12, 4 + (score * 0.2));
    }

    function placeBlock() {
        if (!gameActive || !currentBlock) return;
        const last = stack[stack.length - 1];
        const diff = currentBlock.x - last.x;

        if (Math.abs(diff) >= last.w) {
            endGame();
            return;
        }

        if (diff > 0) { currentBlock.w -= diff; } 
        else { currentBlock.w += diff; currentBlock.x = last.x; }

        stack.push({...currentBlock});
        score++;
        scoreDisplay.innerText = score;
        
        playSound('stack'); // <--- AJOUT SON
        if (navigator.vibrate) navigator.vibrate(15);
        spawnBlock();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const viewLimit = 7; 
        const offset = stack.length > viewLimit ? (stack.length - viewLimit) * blockHeight : 0;

        stack.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.shadowBlur = 15; ctx.shadowColor = b.color;
            ctx.fillRect(b.x, b.y + offset, b.w, blockHeight - 4);
        });

        if (gameActive && currentBlock) {
            ctx.fillStyle = currentBlock.color;
            ctx.shadowBlur = 20; ctx.shadowColor = currentBlock.color;
            ctx.fillRect(currentBlock.x, currentBlock.y + offset, currentBlock.w, blockHeight - 4);
        }
        ctx.shadowBlur = 0;
    }

    function gameLoop() {
        if (!gameActive) return;
        currentBlock.x += speed * direction;
        if (currentBlock.x + currentBlock.w >= canvas.width) {
            currentBlock.x = canvas.width - currentBlock.w;
            direction = -1;
        } else if (currentBlock.x <= 0) {
            currentBlock.x = 0;
            direction = 1;
        }
        draw();
        requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameActive = false;
        playSound('gameOver'); // <--- AJOUT SON
        document.getElementById('title').innerText = "Broken !";
        document.getElementById('msg').innerText = `Score : ${score}`;
        overlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!audioCtx) audioCtx = new AudioCtx();
        startGame();
    });

    const handleInput = (e) => {
        if (gameActive) placeBlock();
    };

    window.addEventListener('mousedown', (e) => {
        if (e.target.id !== 'startBtn') handleInput();
    });
    
    window.addEventListener('touchstart', (e) => {
        if (e.target.id !== 'startBtn') {
            e.preventDefault();
            handleInput();
        }
    }, { passive: false });

    init();
</script>
</body>
</html>
