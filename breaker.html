<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Neon Breaker - Arcade 🧱</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            touch-action: none;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        canvas {
            display: block;
            background: #0f172a;
            border-radius: 2rem;
            width: 100%;
            max-width: 400px;
            height: 60vh;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="py-8 px-4">

    <div class="w-full max-w-md flex items-center justify-between mb-6">
        <a href="index.html" class="w-12 h-12 glass rounded-2xl flex items-center justify-center text-slate-400 active:scale-90 transition-transform">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="flex gap-3">
            <div class="glass px-4 py-2 rounded-2xl flex flex-col items-center">
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Score</span>
                <span id="score" class="font-bold text-orange-400">0</span>
            </div>
            <div class="glass px-4 py-2 rounded-2xl flex flex-col items-center">
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Vies</span>
                <span id="lives" class="font-bold text-red-500">3</span>
            </div>
        </div>
    </div>

    <div class="relative w-full max-w-[400px]">
        <canvas id="breakerCanvas"></canvas>
        
        <div id="overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md rounded-[2rem] flex flex-col items-center justify-center text-center p-6 z-50">
            <div id="start-content">
                <div class="w-20 h-20 bg-orange-500/20 text-orange-500 rounded-full flex items-center justify-center text-3xl mb-4 mx-auto">
                    <i class="fa-solid fa-th-large"></i>
                </div>
                <h2 class="text-2xl font-bold mb-2">Neon Breaker</h2>
                <p class="text-slate-400 mb-8 text-sm">Fais glisser ton doigt pour bouger</p>
                <button onclick="startGame()" class="bg-orange-500 text-white px-10 py-4 rounded-2xl font-bold shadow-lg shadow-orange-500/20 active:scale-95 transition-all">
                    LANCER LA BALLE
                </button>
            </div>
        </div>
    </div>

    <div class="mt-8 text-slate-500 text-[10px] uppercase font-bold tracking-[0.3em] animate-pulse">
        Contrôle tactile fluide
    </div>

    <script>
        const canvas = document.getElementById('breakerCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        
        canvas.width = 400;
        canvas.height = 500;

        // Paramètres du jeu
        let score = 0;
        let lives = 3;
        let gameActive = false;

        const ballRadius = 8;
        let x, y, dx, dy;
        
        const paddleHeight = 12;
        const paddleWidth = 85;
        let paddleX;

        const brickRowCount = 5;
        const brickColumnCount = 5;
        const brickWidth = 65;
        const brickHeight = 25;
        const brickPadding = 10;
        const brickOffsetTop = 50;
        const brickOffsetLeft = 15;

        let bricks = [];

        function initBricks() {
            for(let c=0; c<brickColumnCount; c++) {
                bricks[c] = [];
                for(let r=0; r<brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1 };
                }
            }
        }

        function resetBall() {
            x = canvas.width / 2;
            y = canvas.height - 30;
            dx = 3.5;
            dy = -3.5;
            paddleX = (canvas.width - paddleWidth) / 2;
        }

        function startGame() {
            score = 0;
            lives = 3;
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = lives;
            initBricks();
            resetBall();
            gameActive = true;
            overlay.classList.add('hidden');
            draw();
        }

        // Contrôles tactiles
        window.addEventListener('touchmove', (e) => {
            if(!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            const scaleX = canvas.width / rect.width;
            paddleX = (touchX * scaleX) - paddleWidth / 2;
            
            // Garder le paddle dans le canvas
            if(paddleX < 0) paddleX = 0;
            if(paddleX + paddleWidth > canvas.width) paddleX = canvas.width - paddleWidth;
            e.preventDefault();
        }, { passive: false });

        function collisionDetection() {
            for(let c=0; c<brickColumnCount; c++) {
                for(let r=0; r<brickRowCount; r++) {
                    let b = bricks[c][r];
                    if(b.status === 1) {
                        if(x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score++;
                            document.getElementById('score').innerText = score;
                            if (navigator.vibrate) navigator.vibrate(15);
                            if(score === brickRowCount * brickColumnCount) {
                                alert("VICTOIRE !");
                                document.location.reload();
                            }
                        }
                    }
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI*2);
            ctx.fillStyle = "#fb923c"; // Orange-400
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight, 6);
            ctx.fillStyle = "#f8fafc";
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for(let c=0; c<brickColumnCount; c++) {
                for(let r=0; r<brickRowCount; r++) {
                    if(bricks[c][r].status === 1) {
                        let brickX = (c*(brickWidth+brickPadding)) + brickOffsetLeft;
                        let brickY = (r*(brickHeight+brickPadding)) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        
                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 4);
                        ctx.fillStyle = `rgba(251, 146, 60, ${1 - (r * 0.15)})`; // Dégradé selon la ligne
                        ctx.strokeStyle = "rgba(255,255,255,0.1)";
                        ctx.stroke();
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function draw() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // Rebondir sur les murs
            if(x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
            }
            if(y + dy < ballRadius) {
                dy = -dy;
            } else if(y + dy > canvas.height - ballRadius - 10) {
                if(x > paddleX && x < paddleX + paddleWidth) {
                    dy = -dy;
                    // Ajouter un peu d'effet selon où on touche le paddle
                    dx = 8 * ((x - (paddleX + paddleWidth / 2)) / paddleWidth);
                } else {
                    lives--;
                    document.getElementById('lives').innerText = lives;
                    if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
                    if(!lives) {
                        gameActive = false;
                        overlay.classList.remove('hidden');
                        document.getElementById('start-content').innerHTML = `
                            <h2 class="text-3xl font-bold mb-2">GAME OVER</h2>
                            <p class="text-slate-400 mb-8">Ton score : ${score}</p>
                            <button onclick="startGame()" class="bg-orange-500 text-white px-10 py-4 rounded-2xl font-bold">REESSAYER</button>
                        `;
                    } else {
                        resetBall();
                    }
                }
            }

            x += dx;
            y += dy;
            requestAnimationFrame(draw);
        }

        initBricks();
    </script>
</body>
</html>
