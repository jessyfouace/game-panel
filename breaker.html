<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Neon Breaker PRO 🧱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; touch-action: none; overflow: hidden; position: fixed; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 4em; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        canvas { display: block; background: #0f172a; border-radius: 2rem; width: 100%; max-width: 400px; height: 60vh; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="py-10 px-4">

    <div class="w-full max-w-md flex items-center justify-between mb-6">
        <a href="index.html" class="w-12 h-12 glass rounded-2xl flex items-center justify-center text-slate-400 active:scale-90 transition-transform">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="flex gap-3">
            <div class="glass px-4 py-2 rounded-2xl flex flex-col items-center">
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Score</span>
                <span id="score" class="font-bold text-orange-400">0</span>
            </div>
            <div class="glass px-4 py-2 rounded-2xl flex flex-col items-center">
                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Vies</span>
                <span id="lives" class="font-bold text-red-500">3</span>
            </div>
        </div>
    </div>

    <div class="relative w-full max-w-[400px]">
        <canvas id="breakerCanvas"></canvas>
        <div id="overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md rounded-[2rem] flex flex-col items-center justify-center text-center p-6 z-50">
            <div id="overlay-content">
                <div class="w-20 h-20 bg-orange-500/20 text-orange-500 rounded-full flex items-center justify-center text-3xl mb-4 mx-auto">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h2 id="overlay-title" class="text-2xl font-bold mb-2">Neon Breaker</h2>
                <p id="overlay-msg" class="text-slate-400 mb-8 text-sm">Doigt (Tactile) ou Touches Q / D (Clavier)</p>
                <button onclick="startGame()" class="bg-orange-500 text-white px-10 py-4 rounded-2xl font-bold shadow-lg shadow-orange-500/20 active:scale-95 transition-all">
                    LANCER LA BALLE
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('breakerCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        
        canvas.width = 400;
        canvas.height = 500;

        // --- CONFIGURATION PHYSIQUE ---
        const INITIAL_SPEED = 4.5; // Un peu plus rapide au départ
        const MAX_SPEED = 14;      // Très rapide pour le challenge
        const SPEED_INC = 1.05;    // +5% de vitesse à chaque rebond
        
        let score = 0, lives = 3, gameActive = false;
        let x, y, dx, dy;
        const ballRadius = 8;
        const paddleHeight = 12, paddleWidth = 90;
        let paddleX;

        // Contrôles clavier
        let leftPressed = false;
        let rightPressed = false;
        const keyboardSpeed = 8;

        // Briques
        const brickRowCount = 5, brickColumnCount = 5;
        const brickWidth = 65, brickHeight = 25, brickPadding = 10, brickOffsetTop = 50, brickOffsetLeft = 15;
        let bricks = [];

        // --- MOTEUR AUDIO ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!audioCtx) audioCtx = new AudioCtx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const gain = audioCtx.createGain();
            gain.connect(audioCtx.destination);

            if (type === 'hit') { // Rebond simple
                const osc = audioCtx.createOscillator();
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                osc.connect(gain); osc.start(); osc.stop(now + 0.1);
            } else if (type === 'brick') { // Casse brique
                const osc = audioCtx.createOscillator();
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.05, now);
                osc.connect(gain); osc.start(); osc.stop(now + 0.05);
            } else if (type === 'fail') { // Perte de vie
                const osc = audioCtx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(10, now + 0.5);
                gain.gain.setValueAtTime(0.2, now);
                osc.connect(gain); osc.start(); osc.stop(now + 0.5);
            }
        }

        // --- LOGIQUE JEU ---
        function initBricks() {
            for(let c=0; c<brickColumnCount; c++) {
                bricks[c] = [];
                for(let r=0; r<brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1 };
                }
            }
        }

        function resetBall() {
            x = canvas.width / 2;
            y = canvas.height - 35;
            dx = INITIAL_SPEED;
            dy = -INITIAL_SPEED;
            paddleX = (canvas.width - paddleWidth) / 2;
        }

        function accelerate() {
            let currentSpeed = Math.hypot(dx, dy);
            if (currentSpeed < MAX_SPEED) {
                dx *= SPEED_INC;
                dy *= SPEED_INC;
            }
        }

        function startGame() {
            if (!audioCtx) audioCtx = new AudioCtx();
            score = 0; lives = 3;
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = lives;
            initBricks();
            resetBall();
            gameActive = true;
            overlay.classList.add('hidden');
            draw();
        }

        // --- INPUTS ---
        document.addEventListener("keydown", (e) => {
            if(e.key === "q" || e.key === "Q" || e.key === "ArrowLeft") leftPressed = true;
            if(e.key === "d" || e.key === "D" || e.key === "ArrowRight") rightPressed = true;
        });
        document.addEventListener("keyup", (e) => {
            if(e.key === "q" || e.key === "Q" || e.key === "ArrowLeft") leftPressed = false;
            if(e.key === "d" || e.key === "D" || e.key === "ArrowRight") rightPressed = false;
        });

        window.addEventListener('touchmove', (e) => {
            if(!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            const scaleX = canvas.width / rect.width;
            paddleX = (touchX * scaleX) - paddleWidth / 2;
            if(paddleX < 0) paddleX = 0;
            if(paddleX + paddleWidth > canvas.width) paddleX = canvas.width - paddleWidth;
            e.preventDefault();
        }, { passive: false });

        // --- RENDU ET PHYSIQUE ---
        function draw() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Dessin briques
            for(let c=0; c<brickColumnCount; c++) {
                for(let r=0; r<brickRowCount; r++) {
                    let b = bricks[c][r];
                    if(b.status === 1) {
                        let bx = (c*(brickWidth+brickPadding)) + brickOffsetLeft;
                        let by = (r*(brickHeight+brickPadding)) + brickOffsetTop;
                        b.x = bx; b.y = by;
                        ctx.fillStyle = `rgba(251, 146, 60, ${1 - (r * 0.15)})`;
                        ctx.beginPath(); ctx.roundRect(bx, by, brickWidth, brickHeight, 4); ctx.fill();
                    }
                }
            }

            // Dessin Paddle
            if(leftPressed && paddleX > 0) paddleX -= keyboardSpeed;
            if(rightPressed && paddleX < canvas.width - paddleWidth) paddleX += keyboardSpeed;
            ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.roundRect(paddleX, canvas.height-22, paddleWidth, paddleHeight, 6); ctx.fill();

            // Dessin Balle
            ctx.beginPath(); ctx.arc(x, y, ballRadius, 0, Math.PI*2);
            ctx.fillStyle = "#fb923c";
            ctx.shadowBlur = 15; ctx.shadowColor = "#fb923c";
            ctx.fill(); ctx.shadowBlur = 0;

            // Collisions Briques
            for(let c=0; c<brickColumnCount; c++) {
                for(let r=0; r<brickRowCount; r++) {
                    let b = bricks[c][r];
                    if(b.status === 1 && x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                        dy = -dy; b.status = 0; score++;
                        document.getElementById('score').innerText = score;
                        playSound('brick'); accelerate();
                        if (score === brickRowCount * brickColumnCount) {
                            gameActive = false;
                            document.getElementById('overlay-title').innerText = "BRAVO !";
                            overlay.classList.remove('hidden');
                        }
                    }
                }
            }

            // Rebond Murs & Plafond
            if(x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx; playSound('hit'); accelerate();
            }
            if(y + dy < ballRadius) {
                dy = -dy; playSound('hit'); accelerate();
            } else if(y + dy > canvas.height - ballRadius - 10) {
                if(x > paddleX && x < paddleX + paddleWidth) {
                    dy = -dy;
                    // Angle variable
                    dx = 10 * ((x - (paddleX + paddleWidth/2)) / paddleWidth);
                    playSound('hit'); accelerate();
                    if (navigator.vibrate) navigator.vibrate(10);
                } else {
                    lives--;
                    playSound('fail');
                    document.getElementById('lives').innerText = lives;
                    if(lives <= 0) {
                        gameActive = false;
                        document.getElementById('overlay-title').innerText = "TERMINÉ";
                        overlay.classList.remove('hidden');
                    } else { resetBall(); }
                }
            }

            x += dx; y += dy;
            requestAnimationFrame(draw);
        }

        initBricks();
    </script>
</body>
</html>
