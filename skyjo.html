<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Skyjo - Scoreboard 🟢</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nos Jeux">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .player-card {
            transition: all 0.3s ease;
            border-left: 4px solid #22c55e;
        }
        .score-row:nth-child(even) { background: rgba(255,255,255,0.03); }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <div id="splash-screen" class="fixed inset-0 z-[100] bg-[#0f172a] flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="w-16 h-16 bg-green-500/20 rounded-2xl flex items-center justify-center text-4xl text-green-400 animate-pulse">
            <i class="fa-solid fa-layer-group"></i>
        </div>
        <h2 class="mt-6 text-xl font-bold tracking-widest text-white uppercase">Skyjo</h2>
    </div>

    <div class="container mx-auto px-4 pt-8 max-w-lg">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <a href="index.html" class="text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-arrow-left text-xl"></i>
            </a>
            <h1 class="text-2xl font-black text-green-400 tracking-tighter">SKYJO</h1>
            <button onclick="confirmReset()" class="text-slate-500 hover:text-red-400 transition-colors">
                <i class="fa-solid fa-rotate-right text-xl"></i>
            </button>
        </div>

        <!-- Setup Section -->
        <div id="setup-section" class="glass p-8 rounded-[2.5rem] mb-8">
            <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                <i class="fa-solid fa-users text-green-400"></i> Joueurs
            </h2>
            <div id="setup-players" class="space-y-3 mb-6">
                <input type="text" class="player-input w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-green-500/50" placeholder="Nom...">
                <input type="text" class="player-input w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-green-500/50" placeholder="Nom...">
            </div>
            
            <div class="flex gap-2 mb-8">
                <button onclick="addInput()" class="flex-1 bg-slate-800 py-3 rounded-xl text-sm font-semibold hover:bg-slate-700 transition-colors">+ Joueur</button>
                <button onclick="removeInput()" class="flex-1 bg-slate-800 py-3 rounded-xl text-sm font-semibold hover:bg-slate-700 transition-colors">- Retirer</button>
            </div>

            <button onclick="startGame()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-5 rounded-2xl shadow-lg transition-all active:scale-95">
                Lancer la manche 1
            </button>
        </div>

        <!-- Game Section -->
        <div id="game-section" class="hidden space-y-6">
            <div id="players-list" class="space-y-4">
                <!-- Rendu dynamique -->
            </div>

            <div class="glass p-6 rounded-[2rem]">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-300">Détail des manches</h3>
                    <span id="round-count" class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-400">Manche 1</span>
                </div>
                <div id="rounds-history" class="max-h-60 overflow-y-auto space-y-2 text-sm">
                    <!-- Historique des manches -->
                </div>
            </div>

            <button onclick="openScoreModal()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-5 rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-3">
                <i class="fa-solid fa-plus"></i> Terminer la manche
            </button>
        </div>
    </div>

    <!-- Modal Score -->
    <div id="score-modal" class="fixed inset-0 z-[110] bg-black/90 hidden flex items-center justify-center p-4">
        <div class="glass w-full max-w-sm rounded-[2.5rem] p-8">
            <h3 class="text-xl font-bold mb-6 text-center">Points de la manche</h3>
            <div id="modal-inputs" class="space-y-4 mb-8">
                <!-- Inputs générés -->
            </div>
            <div class="flex gap-4">
                <button onclick="closeScoreModal()" class="flex-1 bg-slate-700 py-4 rounded-2xl font-bold">Annuler</button>
                <button onclick="saveRound()" class="flex-1 bg-green-600 py-4 rounded-2xl font-bold">Enregistrer</button>
            </div>
        </div>
    </div>

    <script>
        let players = [];
        let rounds = [];

        window.onload = function() {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 700);
            }, 1000);
        };

        function addInput() {
            const container = document.getElementById('setup-players');
            if (container.children.length < 8) {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'player-input w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 text-white mt-3 focus:outline-none focus:ring-2 focus:ring-green-500/50';
                input.placeholder = `Nom...`;
                container.appendChild(input);
            }
        }

        function removeInput() {
            const container = document.getElementById('setup-players');
            if (container.children.length > 1) container.removeChild(container.lastChild);
        }

        function startGame() {
            const inputs = document.querySelectorAll('.player-input');
            players = Array.from(inputs).map(input => ({
                name: input.value.trim() || "Anonyme",
                total: 0
            }));
            
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            renderPlayers();
        }

        function renderPlayers() {
            // Trier par score (Skyjo = le plus bas gagne)
            const sorted = [...players].sort((a, b) => a.total - b.total);
            const container = document.getElementById('players-list');
            
            container.innerHTML = players.map((p, i) => {
                const isLeader = p.total === sorted[0].total && p.total !== 0;
                return `
                <div class="player-card glass p-6 rounded-[2rem] flex items-center justify-between border-l-4 ${isLeader ? 'border-yellow-400' : 'border-green-500'}">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">${p.name}</span>
                            ${isLeader ? '<i class="fa-solid fa-crown text-yellow-400 text-[10px]"></i>' : ''}
                        </div>
                        <div class="text-4xl font-black text-white">${p.total}</div>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] text-slate-500 block">TOTAL</span>
                        <span class="text-sm font-bold ${p.total >= 100 ? 'text-red-400' : 'text-slate-300'}">${p.total}/100</span>
                    </div>
                </div>
                `;
            }).join('');
            
            document.getElementById('round-count').textContent = `Manche ${rounds.length + 1}`;
            renderHistory();
        }

        function renderHistory() {
            const history = document.getElementById('rounds-history');
            if (rounds.length === 0) {
                history.innerHTML = '<p class="text-slate-600 italic">Aucune manche enregistrée</p>';
                return;
            }

            history.innerHTML = rounds.map((r, idx) => `
                <div class="score-row flex justify-between p-2 rounded-lg">
                    <span class="text-slate-500 font-bold">M${idx + 1}</span>
                    <div class="flex gap-3">
                        ${r.map((pts, pi) => `
                            <span class="text-xs"><span class="text-slate-500">${players[pi].name.charAt(0)}:</span> ${pts}</span>
                        `).join('')}
                    </div>
                </div>
            `).reverse().join('');
        }

        function openScoreModal() {
            const container = document.getElementById('modal-inputs');
            container.innerHTML = players.map((p, i) => `
                <div class="flex items-center justify-between bg-slate-800/50 p-4 rounded-2xl">
                    <span class="font-bold text-sm">${p.name}</span>
                    <input type="number" id="pts-${i}" class="w-20 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-center font-bold text-green-400 focus:outline-none" placeholder="0">
                </div>
            `).join('');
            document.getElementById('score-modal').classList.remove('hidden');
        }

        function closeScoreModal() {
            document.getElementById('score-modal').classList.add('hidden');
        }

        function saveRound() {
            const currentRound = [];
            players.forEach((p, i) => {
                const val = parseInt(document.getElementById(`pts-${i}`).value) || 0;
                currentRound.push(val);
                p.total += val;
            });

            rounds.push(currentRound);
            closeScoreModal();
            renderPlayers();
            
            // Check fin de partie
            const losers = players.filter(p => p.total >= 100);
            if (losers.length > 0) {
                setTimeout(() => alert("Partie terminée ! Quelqu'un a dépassé 100 points."), 500);
            }
        }

        function confirmReset() {
            if(confirm("Réinitialiser tous les scores ?")) location.reload();
        }
    </script>
</body>
</html>
